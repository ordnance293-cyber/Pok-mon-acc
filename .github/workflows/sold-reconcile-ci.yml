name: Sold reconciliation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sold-reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js current LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sold-account cleanup tests
        run: node tests/sold-account-cleanup.test.js

      - name: Run Apps Script reconciliation tests
        run: node tests/apps-script-sold-reconcile.test.js

      - name: Run static regression checks
        run: python tests/verify_regressions.py

      - name: Check committed diff
        run: git diff --check HEAD^ HEAD
