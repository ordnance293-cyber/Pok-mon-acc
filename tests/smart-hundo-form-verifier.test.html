<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Smart Hundo form verifier tests</title>
  <script src="../smart-hundo-helpers.js"></script>
  <script src="../smart-hundo-form-verifier.js"></script>
</head>
<body data-test-status="running">
  <pre id="results"></pre>
  <script>
    (() => {
      'use strict';

      const results = [];
      const unexpectedDiagnostics = [];
      let executionStatus = 'running';
      const serialize = value => value instanceof Error
        ? { name: value.name, message: value.message }
        : value === undefined ? 'undefined' : String(value);
      const recordDiagnostic = (channel, value) => {
        unexpectedDiagnostics.push({ channel, value: serialize(value) });
        render();
      };
      window.addEventListener('error', event => recordDiagnostic('window.error', event.error || event.message));
      window.addEventListener('unhandledrejection', event => recordDiagnostic('unhandledrejection', event.reason));
      const nativeConsoleError = console.error.bind(console);
      console.error = (...args) => {
        recordDiagnostic('console.error', args[0]);
        nativeConsoleError(...args);
      };
      const fail = message => { throw new Error(message); };
      const equal = (actual, expected, message = 'values differ') => {
        if (actual !== expected) fail(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      };
      const deepEqual = (actual, expected, message = 'values differ') => {
        const actualJson = JSON.stringify(actual);
        const expectedJson = JSON.stringify(expected);
        if (actualJson !== expectedJson) fail(`${message}: expected ${expectedJson}, got ${actualJson}`);
      };
      const test = (name, callback) => {
        try {
          callback();
          results.push(`PASS ${name}`);
        } catch (error) {
          results.push(`FAIL ${name}: ${error && error.message ? error.message : String(error)}`);
        }
      };
      const render = () => {
        const passed = results.filter(result => result.startsWith('PASS ')).length;
        const assertionFailures = results.filter(result => result.startsWith('FAIL '));
        const diagnosticFailures = unexpectedDiagnostics.map(diagnostic => `FAIL ${diagnostic.channel}: ${diagnostic.value}`);
        const failed = assertionFailures.length + diagnosticFailures.length;
        document.body.dataset.testPassed = String(passed);
        document.body.dataset.testFailed = String(failed);
        document.body.dataset.testStatus = executionStatus === 'pass' && failed === 0 ? 'pass' : 'fail';
        document.getElementById('results').textContent = [...results, ...diagnosticFailures].join('\n');
      };
      const verifier = () => {
        if (!globalThis.SmartHundoFormVerifier) fail('globalThis.SmartHundoFormVerifier is absent');
        return globalThis.SmartHundoFormVerifier;
      };
      const validBboxContract = () => ({
        card_bbox: { x_min: 50, y_min: 100, x_max: 450, y_max: 800 },
        pokemon_bbox: { x_min: 120, y_min: 220, x_max: 380, y_max: 680 },
        bbox_confidence: 0.91,
        bbox_visibility: 'clear'
      });
      const targetCard = (overrides = {}) => ({
        card_id: '0:2:1:1',
        screenshot_index: 0,
        order: 2,
        row: 1,
        column: 1,
        base_species: '帝牙盧卡',
        recognition_status: 'recognized',
        species_confidence: 0.8,
        form_id: 'dialga_standard',
        effective_form_id: 'dialga_standard',
        form_confidence: 0.9,
        form_evidence: { visual_signature: 'dialga_standard' },
        canonical_official_name: '帝牙盧卡',
        manual_review_reasons: ['form_uncertain', 'species_uncertain'],
        ...validBboxContract(),
        ...overrides
      });

      test('exports exactly ten target base species', () => {
        deepEqual(verifier().TARGET_HUNDO_FORM_BASE_SPECIES, ['急凍鳥', '閃電鳥', '火焰鳥', '蒼響', '藏瑪然特', '帝牙盧卡', '帕路奇亞', '基格爾德', '奈克洛茲瑪', '酋雷姆']);
      });
      test('freezes every target candidate array and every evidence tuple', () => {
        const api = verifier();
        equal(Object.isFrozen(api.TARGET_HUNDO_FORM_BASE_SPECIES), true);
        Object.values(api.VERIFIED_FORM_IDS_BY_BASE_SPECIES).forEach(value => equal(Object.isFrozen(value), true));
        equal(Object.isFrozen(api.REQUIRED_VERIFIED_FORM_EVIDENCE), true);
        Object.values(api.REQUIRED_VERIFIED_FORM_EVIDENCE).forEach(value => equal(Object.isFrozen(value), true));
      });
      test('exports all ten candidate maps and 23 supported forms', () => {
        equal(Object.keys(verifier().VERIFIED_FORM_IDS_BY_BASE_SPECIES).length, 10);
        equal(Object.values(verifier().VERIFIED_FORM_IDS_BY_BASE_SPECIES).flat().filter(id => id !== 'uncertain').length, 23);
        deepEqual(verifier().VERIFIED_FORM_IDS_BY_BASE_SPECIES['急凍鳥'], ['articuno_standard', 'articuno_galarian', 'uncertain']);
        deepEqual(verifier().VERIFIED_FORM_IDS_BY_BASE_SPECIES['酋雷姆'], ['kyurem_base', 'kyurem_white', 'kyurem_black', 'uncertain']);
      });
      test('exports all seven approved evidence tuples as literals', () => {
        deepEqual(Object.fromEntries(Object.entries(verifier().REQUIRED_VERIFIED_FORM_EVIDENCE).filter(([id]) => ['dialga_standard', 'dialga_origin', 'palkia_standard', 'palkia_origin', 'necrozma_base', 'necrozma_dusk_mane', 'necrozma_dawn_wings'].includes(id))), {
          dialga_standard: { base_species: '帝牙盧卡', body_plan: 'dialga_stocky_wide_quadruped', limb_layout: 'four_standard_legs', fusion_host: 'not_applicable', decisive_feature: 'dialga_standard_stocky_neck_chest' },
          dialga_origin: { base_species: '帝牙盧卡', body_plan: 'dialga_elongated_equine_quadruped', limb_layout: 'four_long_legs', fusion_host: 'not_applicable', decisive_feature: 'dialga_origin_elongated_neck_chest' },
          palkia_standard: { base_species: '帕路奇亞', body_plan: 'palkia_upright_biped_with_arms', limb_layout: 'two_arms_two_legs', fusion_host: 'not_applicable', decisive_feature: 'palkia_standard_visible_arms' },
          palkia_origin: { base_species: '帕路奇亞', body_plan: 'palkia_centaur_quadruped', limb_layout: 'four_legs_no_standard_arms', fusion_host: 'not_applicable', decisive_feature: 'palkia_origin_centaur_body' },
          necrozma_base: { base_species: '奈克洛茲瑪', body_plan: 'necrozma_upright_crystalline', limb_layout: 'upright_crystalline_limbs', fusion_host: 'none', decisive_feature: 'necrozma_base_crystal_body' },
          necrozma_dusk_mane: { base_species: '奈克洛茲瑪', body_plan: 'necrozma_quadruped_lion', limb_layout: 'quadruped_lion', fusion_host: 'solgaleo', decisive_feature: 'necrozma_dusk_mane_lion_crystal_armor' },
          necrozma_dawn_wings: { base_species: '奈克洛茲瑪', body_plan: 'necrozma_wide_moon_wings', limb_layout: 'giant_wings_no_lion_body', fusion_host: 'lunala', decisive_feature: 'necrozma_dawn_wings_moon_wings' }
        });
      });
      test('preserves the seven canonical names through SmartHundoHelpers', () => {
        const names = globalThis.SmartHundoHelpers.HUNDO_FORM_CANONICAL_NAMES;
        deepEqual([
          names.dialga_standard, names.dialga_origin, names.palkia_standard, names.palkia_origin,
          names.necrozma_base, names.necrozma_dusk_mane, names.necrozma_dawn_wings
        ], ['帝牙盧卡', '起源帝牙盧卡', '帕路奇亞', '起源帕路奇亞', '奈克洛茲瑪', '奈克洛茲瑪（黃昏之鬃）', '奈克洛茲瑪（拂曉之翼）']);
      });
      test('accepts a valid integer bbox pair', () => {
        const normalized = verifier().normalizeHundoBboxContract(validBboxContract());
        deepEqual(normalized, { ...validBboxContract(), bbox_valid: true });
      });
      test('rejects equal reversed out-of-range and non-integer coordinates', () => {
        const api = verifier();
        [
          { x_min: 1, y_min: 1, x_max: 1, y_max: 2 },
          { x_min: 3, y_min: 1, x_max: 2, y_max: 2 },
          { x_min: 1, y_min: 4, x_max: 2, y_max: 3 },
          { x_min: -1, y_min: 1, x_max: 2, y_max: 3 },
          { x_min: 1.5, y_min: 1, x_max: 2, y_max: 3 }
        ].forEach(value => equal(api.normalizeHundoBoundingBox(value), null));
      });
      test('rejects strings booleans arrays NaN Infinity and extra bbox properties', () => {
        const api = verifier();
        [
          { x_min: '1', y_min: 1, x_max: 2, y_max: 3 },
          { x_min: true, y_min: 1, x_max: 2, y_max: 3 },
          [1, 1, 2, 3],
          { x_min: NaN, y_min: 1, x_max: 2, y_max: 3 },
          { x_min: 1, y_min: 1, x_max: Infinity, y_max: 3 },
          { x_min: 1, y_min: 1, x_max: 2, y_max: 3, extra: 0 }
        ].forEach(value => equal(api.normalizeHundoBoundingBox(value), null));
      });
      test('rejects non-enumerable and symbol bbox own properties', () => {
        const api = verifier();
        const nonEnumerable = { x_min: 1, y_min: 1, x_max: 2, y_max: 3 };
        Object.defineProperty(nonEnumerable, 'hidden', { value: 0 });
        equal(api.normalizeHundoBoundingBox(nonEnumerable), null);
        const symbolExtra = { x_min: 1, y_min: 1, x_max: 2, y_max: 3 };
        symbolExtra[Symbol('extra')] = 0;
        equal(api.normalizeHundoBoundingBox(symbolExtra), null);
      });
      test('requires pokemon card intersection and pokemon center inside card', () => {
        const api = verifier();
        const outside = validBboxContract();
        outside.pokemon_bbox = { x_min: 451, y_min: 220, x_max: 600, y_max: 680 };
        equal(api.normalizeHundoBboxContract(outside).bbox_valid, false);
        const centerOutside = validBboxContract();
        centerOutside.pokemon_bbox = { x_min: 400, y_min: 220, x_max: 600, y_max: 680 };
        equal(api.normalizeHundoBboxContract(centerOutside).bbox_valid, false);
      });
      test('accepts bbox_confidence only as a finite primitive number', () => {
        const api = verifier();
        ['0.91', true, [], NaN, Infinity].forEach(value => {
          const contract = validBboxContract();
          contract.bbox_confidence = value;
          equal(api.normalizeHundoBboxContract(contract).bbox_valid, false);
        });
        equal(api.normalizeHundoBboxContract(validBboxContract()).bbox_valid, true);
      });
      test('selects only recognized usable-partial target cards at species confidence 0.80', () => {
        const api = verifier();
        const partial = targetCard({ card_id: '0:3:1:2', order: 3, column: 2, recognition_status: 'partial' });
        const below = targetCard({ card_id: '0:4:2:1', order: 4, row: 2, species_confidence: 0.79 });
        const nonTarget = targetCard({ card_id: '0:5:2:2', order: 5, row: 2, column: 2, base_species: '超夢' });
        const planned = api.planTargetHundoFormCandidates([targetCard(), partial, below, nonTarget]);
        equal(planned.target_card_count, 3);
        equal(planned.target_candidate_count, 2);
        deepEqual(planned.candidates.map(candidate => candidate.card_id), ['0:2:1:1', '0:3:1:2']);
        equal(planned.cards[3], nonTarget);
        deepEqual(planned.cards[0].manual_review_reasons, ['species_uncertain']);
        equal(planned.cards[0].verification_status, 'pending');
      });
      test('marks invalid target bbox as form_crop_missing', () => {
        const planned = verifier().planTargetHundoFormCandidates([targetCard({ pokemon_bbox: null })]);
        equal(planned.target_candidate_count, 0);
        equal(planned.cards[0].verification_status, 'not_requested');
        equal(planned.cards[0].manual_review_reasons.includes('form_crop_missing'), true);
        equal(planned.cards[0].effective_form_id, 'uncertain');
      });
      test('marks low bbox confidence or unclear bbox as form_crop_not_clear', () => {
        const low = targetCard({ card_id: '0:3:1:1', bbox_confidence: 0.79 });
        const unclear = targetCard({ card_id: '0:4:1:1', bbox_visibility: 'cropped' });
        const planned = verifier().planTargetHundoFormCandidates([low, unclear]);
        deepEqual(planned.cards.map(card => card.manual_review_reasons.includes('form_crop_not_clear')), [true, true]);
      });
      test('marks valid geometry with invalid confidence or unusable visibility as form_crop_not_clear', () => {
        const cases = [
          targetCard({ card_id: '0:3:1:1', bbox_confidence: '0.91' }),
          targetCard({ card_id: '0:4:1:1', bbox_visibility: 'uncertain' }),
          targetCard({ card_id: '0:5:1:1', bbox_visibility: 'not_visible' }),
          targetCard({ card_id: '0:6:1:1', bbox_visibility: 'not_an_enum' })
        ];
        const planned = verifier().planTargetHundoFormCandidates(cases);
        equal(planned.target_candidate_count, 0);
        planned.cards.forEach(card => {
          equal(card.manual_review_reasons.includes('form_crop_not_clear'), true);
          equal(card.manual_review_reasons.includes('form_crop_missing'), false);
        });
      });
      test('fails closed for missing stable card coordinates or a non-integer screenshot', () => {
        const missing = targetCard({ card_id: undefined, screenshot_index: undefined, order: undefined, row: undefined, column: undefined });
        const nonIntegerScreenshot = targetCard({ card_id: undefined, screenshot_index: 0.5 });
        const planned = verifier().planTargetHundoFormCandidates([missing, nonIntegerScreenshot]);
        equal(planned.target_candidate_count, 0);
        planned.cards.forEach(card => {
          equal(card.verification_status, 'not_requested');
          equal(card.manual_review_reasons.includes('form_crop_missing'), true);
          equal(card.effective_form_id, 'uncertain');
        });
      });
      test('fails closed for duplicate candidate IDs and malformed batch job IDs', () => {
        const first = targetCard({ card_id: '0:duplicate:1:1' });
        const second = targetCard({ card_id: '0:duplicate:1:1', order: 3 });
        const planned = verifier().planTargetHundoFormCandidates([first, second]);
        equal(planned.target_candidate_count, 0);
        planned.cards.forEach(card => equal(card.manual_review_reasons.includes('form_crop_missing'), true));
        deepEqual(verifier().planHundoFormVerificationBatches([
          { card_id: '0:1:1:1', screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard'] },
          { card_id: '0:1:1:1', screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard'] }
        ]), []);
        deepEqual(verifier().planHundoFormVerificationBatches([
          { card_id: '', screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard'] }
        ]), []);
      });
      test('persists an options-derived identity for deterministic failure marking without mutating input', () => {
        const input = targetCard({ card_id: undefined, screenshot_index: undefined, order: 7, row: 2, column: 3 });
        const planned = verifier().planTargetHundoFormCandidates([input], { screenshotIndex: 0 });
        deepEqual(planned.candidates.map(candidate => candidate.card_id), ['0:7:2:3']);
        equal(planned.cards[0].card_id, '0:7:2:3');
        equal(planned.cards[0].screenshot_index, 0);
        equal(input.card_id, undefined);
        equal(input.screenshot_index, undefined);
        const failed = verifier().markHundoFormVerificationFailure(
          planned.cards,
          ['0:7:2:3'],
          'form_verification_request_failed',
          'failed'
        );
        equal(failed[0].verification_status, 'failed');
        equal(failed[0].manual_review_reasons.includes('form_verification_request_failed'), true);
      });
      test('plans zero batches for zero candidates', () => {
        deepEqual(verifier().planHundoFormVerificationBatches([]), []);
      });
      test('plans one six-job batch for six candidates', () => {
        const candidates = Array.from({ length: 6 }, (_, index) => ({ card_id: `0:${index + 1}:1:1`, screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard', 'dialga_origin', 'uncertain'] }));
        const batches = verifier().planHundoFormVerificationBatches(candidates);
        equal(batches.length, 1);
        equal(batches[0].contact_sheet_id, '0:form:1');
        equal(batches[0].jobs.length, 6);
      });
      test('plans two batches of six and one for seven candidates', () => {
        const candidates = Array.from({ length: 7 }, (_, index) => ({ card_id: `0:${index + 1}:1:1`, screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard', 'dialga_origin', 'uncertain'] }));
        const batches = verifier().planHundoFormVerificationBatches(candidates);
        deepEqual(batches.map(batch => batch.jobs.length), [6, 1]);
        deepEqual(batches.map(batch => batch.contact_sheet_id), ['0:form:1', '0:form:2']);
      });
      test('uses stable T1 through T6 IDs without species form or CP labels', () => {
        const candidates = Array.from({ length: 6 }, (_, index) => ({ card_id: `0:${index + 1}:1:1`, screenshot_index: 0, base_species: '帝牙盧卡', candidate_form_ids: ['dialga_standard', 'dialga_origin', 'uncertain'], cp: '9999', visible_label: 'never-exported' }));
        const jobs = verifier().planHundoFormVerificationBatches(candidates)[0].jobs;
        deepEqual(jobs.map(job => job.tile_id), ['T1', 'T2', 'T3', 'T4', 'T5', 'T6']);
        jobs.forEach(job => deepEqual(Object.keys(job), ['tile_id', 'card_id', 'screenshot_index', 'base_species', 'candidate_form_ids']));
      });

      const verifierJob = (overrides = {}) => ({
        tile_id: 'T1',
        card_id: '0:2:1:1',
        base_species: verifier().REQUIRED_VERIFIED_FORM_EVIDENCE.dialga_origin.base_species,
        candidate_form_ids: ['dialga_standard', 'dialga_origin', 'uncertain'],
        ...overrides
      });
      const verifiedResult = (formId = 'dialga_origin', overrides = {}) => {
        const tuple = verifier().REQUIRED_VERIFIED_FORM_EVIDENCE[formId];
        return {
          tile_id: 'T1',
          card_id: '0:2:1:1',
          base_species: tuple.base_species,
          verified_form_id: formId,
          verification_confidence: 0.97,
          crop_visibility: 'clear',
          body_plan: tuple.body_plan,
          limb_layout: tuple.limb_layout,
          fusion_host: tuple.fusion_host,
          decisive_feature: tuple.decisive_feature,
          key_features_visible: true,
          ...overrides
        };
      };
      const verifiedEnvelope = (cards, overrides = {}) => ({ cards, ...overrides });
      const structure = (result, jobs = [verifierJob()], finishReason = 'stop') => verifier()
        .validateHundoFormVerifierStructure(result, jobs, finishReason);

      test('normalizes only exact complete verifier cards and preserves all seven exact evidence tuples', () => {
        const api = verifier();
        const jobs = Object.keys(api.REQUIRED_VERIFIED_FORM_EVIDENCE).map((formId, index) => {
          const tuple = api.REQUIRED_VERIFIED_FORM_EVIDENCE[formId];
          return {
            tile_id: `T${index + 1}`,
            card_id: `0:${index + 1}:1:1`,
            base_species: tuple.base_species,
            candidate_form_ids: [formId, 'uncertain']
          };
        });
        const cards = jobs.map((job, index) => verifiedResult(Object.keys(api.REQUIRED_VERIFIED_FORM_EVIDENCE)[index], {
          tile_id: job.tile_id,
          card_id: job.card_id
        }));
        const normalized = api.normalizeHundoFormVerifierResult(verifiedEnvelope(cards));
        deepEqual(normalized, verifiedEnvelope(cards));
        equal(structure(normalized, jobs).complete, true);
        cards.forEach((card, index) => {
          const verdict = api.validateHundoVerifiedForm(card, jobs[index]);
          equal(verdict.valid, true, card.verified_form_id);
        });
      });

      test('rejects strict primitive schema violations and all evidence conflicts', () => {
        const api = verifier();
        ['0.97', true, [], {}, NaN, Infinity].forEach(value => {
          const result = verifiedEnvelope([verifiedResult('dialga_origin', { verification_confidence: value })]);
          const outcome = structure(result);
          equal(outcome.complete, false);
          equal(outcome.retry_reasons.includes('invalid_required_field'), true);
        });
        const checks = [
          ['dialga body mismatch', verifiedResult('dialga_origin', { body_plan: 'dialga_stocky_wide_quadruped' }), 'form_verifier_evidence_mismatch'],
          ['dialga limb mismatch', verifiedResult('dialga_origin', { limb_layout: 'four_standard_legs' }), 'form_verifier_evidence_mismatch'],
          ['palkia arm conflict', verifiedResult('palkia_origin', { body_plan: 'palkia_upright_biped_with_arms' }), 'form_verifier_evidence_mismatch'],
          ['necrozma fusion conflict', verifiedResult('necrozma_dusk_mane', { fusion_host: 'lunala' }), 'form_verifier_evidence_mismatch'],
          ['cross species form', verifiedResult('dialga_origin', { base_species: verifier().REQUIRED_VERIFIED_FORM_EVIDENCE.palkia_origin.base_species }), 'form_verifier_species_mismatch'],
          ['uncertain form', verifiedResult('dialga_origin', { verified_form_id: 'uncertain' }), 'form_verifier_uncertain'],
          ['clear threshold', verifiedResult('dialga_origin', { verification_confidence: 0.899 }), 'form_verifier_low_confidence'],
          ['partial threshold', verifiedResult('dialga_origin', { crop_visibility: 'partially_visible', verification_confidence: 0.949 }), 'form_verifier_low_confidence'],
          ['cropped visibility', verifiedResult('dialga_origin', { crop_visibility: 'cropped' }), 'form_verifier_evidence_mismatch'],
          ['not-visible visibility', verifiedResult('dialga_origin', { crop_visibility: 'not_visible' }), 'form_verifier_evidence_mismatch'],
          ['uncertain visibility', verifiedResult('dialga_origin', { crop_visibility: 'uncertain' }), 'form_verifier_evidence_mismatch']
        ];
        checks.forEach(([name, card, reason]) => {
          const job = verifierJob({ base_species: card.base_species, candidate_form_ids: ['dialga_origin', 'palkia_origin', 'necrozma_dusk_mane', 'uncertain'] });
          equal(api.validateHundoVerifiedForm(card, job).reason, reason, name);
        });
        equal(api.validateHundoVerifiedForm(verifiedResult('dialga_origin', { verification_confidence: 0.90 }), verifierJob()).valid, true);
        equal(api.validateHundoVerifiedForm(verifiedResult('dialga_origin', { crop_visibility: 'partially_visible', verification_confidence: 0.95 }), verifierJob()).valid, true);
      });

      test('rejects false key evidence and each explicit necrozma upright lion moon-wing conflict', () => {
        const api = verifier();
        equal(api.validateHundoVerifiedForm(verifiedResult('dialga_origin', { key_features_visible: false }), verifierJob()).reason, 'form_verifier_evidence_mismatch');
        const forms = ['necrozma_base', 'necrozma_dusk_mane', 'necrozma_dawn_wings'];
        const bodies = ['necrozma_upright_crystalline', 'necrozma_quadruped_lion', 'necrozma_wide_moon_wings'];
        const limbs = ['upright_crystalline_limbs', 'quadruped_lion', 'giant_wings_no_lion_body'];
        forms.forEach((formId, index) => {
          const expected = api.REQUIRED_VERIFIED_FORM_EVIDENCE[formId];
          const bodyConflict = verifiedResult(formId, { body_plan: bodies[(index + 1) % bodies.length] });
          const limbConflict = verifiedResult(formId, { limb_layout: limbs[(index + 2) % limbs.length] });
          const job = verifierJob({ base_species: expected.base_species, candidate_form_ids: [formId, 'uncertain'] });
          equal(api.validateHundoVerifiedForm(bodyConflict, job).reason, 'form_verifier_evidence_mismatch', `${formId} body`);
          equal(api.validateHundoVerifiedForm(limbConflict, job).reason, 'form_verifier_evidence_mismatch', `${formId} limb`);
        });
      });

      test('handles clear and partially-visible confidence boundaries independently', () => {
        const api = verifier();
        equal(api.validateHundoVerifiedForm(verifiedResult('dialga_origin', { verification_confidence: 0.899 }), verifierJob()).reason, 'form_verifier_low_confidence');
        equal(api.validateHundoVerifiedForm(verifiedResult('dialga_origin', { verification_confidence: 0.90 }), verifierJob()).valid, true);
