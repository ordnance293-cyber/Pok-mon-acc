<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart hundo helper tests</title>
  <script src="../smart-hundo-helpers.js"></script>
</head>
<body data-test-status="running">
  <pre id="results"></pre>
  <script>
    (async () => {
      'use strict';

      const results = [];
      const loggedValues = [];
      const unexpectedDiagnostics = [];
      const nativeSetTimeout = globalThis.setTimeout.bind(globalThis);
      let executionStatus = 'running';
      const serializeHarnessValue = (value, seen = new WeakSet()) => {
        if (value instanceof Error) {
          return {
            name: String(value.name || 'Error'),
            message: String(value.message || ''),
            stack: String(value.stack || '')
          };
        }
        if (value === null || ['string', 'number', 'boolean'].includes(typeof value)) return value;
        if (['undefined', 'bigint', 'symbol', 'function'].includes(typeof value)) return String(value);
        if (seen.has(value)) return '[Circular]';
        seen.add(value);
        if (Array.isArray(value)) return value.map(item => serializeHarnessValue(item, seen));
        try {
          return Object.fromEntries(
            Object.entries(value).map(([key, item]) => [key, serializeHarnessValue(item, seen)])
          );
        } catch (error) {
          return {
            name: 'UnserializableValue',
            message: String(error && error.message ? error.message : error),
            stack: ''
          };
        }
      };
      const createHarnessErrorRecorder = (target, onRecord = () => {}) => {
        const record = (channel, args) => {
          const diagnostic = {
            channel,
            arguments: args.map(argument => serializeHarnessValue(argument))
          };
          target.push(diagnostic);
          onRecord();
          return diagnostic;
        };
        return {
          consoleError: (...args) => record('console.error', args),
          windowError: (event = {}) => record('window.error', [
            event.error instanceof Error
              ? event.error
              : { name: 'Error', message: String(event.message || 'Unknown window error'), stack: '' }
          ]),
          unhandledRejection: (event = {}) => record('unhandledrejection', [
            event.reason === undefined ? 'Unknown unhandled rejection' : event.reason
          ])
        };
      };
      const deriveHarnessStatus = (status, failedCount, diagnostics) => (
        status === 'pass' && failedCount === 0 && diagnostics.length === 0 ? 'pass' : 'fail'
      );
      const renderTestSummary = () => {
        const passedCount = results.filter(result => result.startsWith('PASS ')).length;
        const assertionFailures = results.filter(result => result.startsWith('FAIL '));
        const diagnosticFailures = unexpectedDiagnostics.map(diagnostic => (
          `FAIL ${diagnostic.channel}: ${JSON.stringify(diagnostic.arguments)}`
        ));
        const failedCount = assertionFailures.length + diagnosticFailures.length;
        document.body.dataset.testPassed = String(passedCount);
        document.body.dataset.testFailed = String(failedCount);
        document.body.dataset.testStatus = deriveHarnessStatus(executionStatus, failedCount, unexpectedDiagnostics);
        document.getElementById('results').textContent = [...results, ...diagnosticFailures].join('\n');
      };
      const harnessErrorRecorder = createHarnessErrorRecorder(unexpectedDiagnostics, renderTestSummary);
      window.addEventListener('error', harnessErrorRecorder.windowError);
      window.addEventListener('unhandledrejection', harnessErrorRecorder.unhandledRejection);
      console.log = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.warn = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.error = (...args) => {
        loggedValues.push(args.map(argument => serializeHarnessValue(argument)));
        harnessErrorRecorder.consoleError(...args);
      };
      const fail = (message) => { throw new Error(message); };
      const equal = (actual, expected, message = 'values differ') => {
        if (actual !== expected) fail(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      };
      const deepEqual = (actual, expected, message = 'values differ') => {
        const actualJson = JSON.stringify(actual);
        const expectedJson = JSON.stringify(expected);
        if (actualJson !== expectedJson) fail(`${message}: expected ${expectedJson}, got ${actualJson}`);
      };
      const test = (name, callback) => {
        callback();
        results.push(`PASS ${name}`);
      };
      const asyncTest = async (name, callback) => {
        await callback();
        results.push(`PASS ${name}`);
      };
      const card = (overrides = {}) => ({
        order: 1,
        row: 1,
        column: 1,
        visible_label: '畫面名稱',
        official_name: '超夢',
        recognition_status: 'recognized',
        species_confidence: 0.9,
        shiny_state: 'no',
        shiny_confidence: 0.9,
        purified_state: 'no',
        purified_confidence: 0.9,
        shadow_state: 'no',
        shadow_confidence: 0.9,
        ...overrides
      });
      const normalizeNumber = (value) => {
        const match = String(value ?? '').match(/\d+/);
        return match ? match[0] : '';
      };
      const normalizeName = (value) => String(value ?? '').trim().replace(/^官方:/, '');
      const normalizeList = (value) => [...new Set(String(value ?? '').split(',').filter(Boolean))].join(',');
      const normalizeCountingList = (value) => {
        const counts = new Map();
        const order = [];
        String(value ?? '').split(',').filter(Boolean).forEach(name => {
          if (!counts.has(name)) order.push(name);
          counts.set(name, (counts.get(name) || 0) + 1);
        });
        return order.map(name => counts.get(name) > 1 ? `${name}*${counts.get(name)}` : name).join(',');
      };
      const assertRejects = async (promise, expectedMessage, forbiddenValue) => {
        try {
          await promise;
          fail('expected promise to reject');
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          if (!message.includes(expectedMessage)) fail(`expected error containing ${JSON.stringify(expectedMessage)}, got ${JSON.stringify(message)}`);
          if (forbiddenValue && message.includes(forbiddenValue)) fail('error message exposed the data URL');
        }
      };

      try {
        const helpers = globalThis.SmartHundoHelpers;
        if (!helpers) fail('SmartHundoHelpers is missing');
        const {
          normalizeSearchQuery,
          isSmartHundoClassification,
          partitionImageJobs,
          normalizeSmartHundoResult,
          smartHundoCardsToPokemonList,
          mergeSmartHundoScanResults
        } = helpers;

        test('normalizes each required hundo query variant', () => {
          const canonical = '傳說的寶可夢,幻,究極異獸&4*';
          const variants = [
            ['full-width punctuation', '傳說的寶可夢，幻，究極異獸＆4＊'],
            ['unicode whitespace', '\u3000傳說的寶可夢,\n幻,\t究極異獸&4*\u00a0'],
            ['mixed width punctuation', '傳說的寶可夢，幻，究極異獸＆４＊']
          ];
          variants.forEach(([name, value]) => equal(normalizeSearchQuery(value), canonical, name));
        });

        test('partitions only the exact hundo classification route', () => {
          const jobs = [
            { index: 0, classification: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢,幻,究極異獸&異色&4*' } },
            { index: 1, classification: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢，幻，究極異獸＆4＊' } },
            { index: 2, classification: { image_type: 'OTHER', search_query: '傳說的寶可夢,幻,究極異獸&4*' } }
          ];
          const partitioned = partitionImageJobs(jobs);
          deepEqual(partitioned.smartHundoJobs.map(job => job.index), [1]);
          deepEqual(partitioned.normalJobs.map(job => job.index), [0, 2]);
          equal(isSmartHundoClassification(jobs[1].classification), true);
          equal(isSmartHundoClassification(jobs[0].classification), false);
        });

        test('converts purified, shiny, shadow, and duplicate cards without a purified prefix', () => {
          const cards = [
            card({ official_name: '超夢', purified_state: 'yes' }),
            card({ order: 2, official_name: '夢幻', shiny_state: 'yes', purified_state: 'yes' }),
            card({ order: 3, official_name: '烈空坐', shadow_state: 'yes' }),
            card({ order: 4, official_name: '超夢', shiny_state: 'yes', shadow_state: 'yes' }),
            card({ order: 5, official_name: '超夢', shiny_state: 'yes', shadow_state: 'yes' })
          ];
          const conversion = smartHundoCardsToPokemonList(cards, normalizeName, normalizeList);
          equal(conversion.pokemon_list, '超夢,色違夢幻,暗影烈空坐,色違暗影超夢');
          equal(conversion.recognized_count, 5);
          equal(conversion.uncertain_count, 0);
          equal(smartHundoCardsToPokemonList([card({ shiny_state: 'yes', shadow_state: 'yes' })], normalizeName, normalizeList).pokemon_list, '色違暗影超夢');
        });

        test('normalizes empty official names and only exact normalized duplicate positions', () => {
          const normalized = normalizeSmartHundoResult({
            hundo_leg: '第 8 隻',
            hundo_leg_confidence: 1.7,
            detected_card_count: '3',
            cards: [
              card({ order: '2', row: '1', column: '1', official_name: '  ', visible_label: '不可用', species_confidence: -2 }),
              card({ order: '1', row: '1', column: '1', official_name: ' 超夢 ' }),
              card({ order: '1', row: '1', column: '1', official_name: '超夢' }),
              card({ order: '1', row: '1', column: '1', official_name: '夢幻' })
            ]
          }, normalizeNumber, normalizeName);
          equal(normalized.cards[0].official_name, '超夢');
          equal(normalized.cards[1].official_name, '夢幻');
          equal(normalized.cards[2].official_name, '');
          equal(normalized.cards.length, 3);
          equal(normalized.cards[2].species_confidence, 0);
          equal(normalized.hundo_leg_confidence, 1);
          equal(normalized.hundo_leg, '8');
          equal(normalized.detected_card_count, 3);
        });

        test('deduplicates exact cards within one screenshot before conversion', () => {
          const duplicateWithinScreenshot = card({ official_name: '超夢', order: 1, row: 1, column: 1 });
          const normalized = normalizeSmartHundoResult({
            detected_card_count: 2,
            cards: [duplicateWithinScreenshot, { ...duplicateWithinScreenshot }]
          }, normalizeNumber, normalizeName);
          const conversion = smartHundoCardsToPokemonList(normalized.cards, normalizeName, normalizeCountingList);
          equal(normalized.cards.length, 1);
          equal(conversion.pokemon_list, '超夢');
          equal(conversion.recognized_count, 1);
        });

        test('counts uncertain species or independent states for manual review', () => {
          const conversion = smartHundoCardsToPokemonList([
            card({ official_name: '超夢', shiny_state: 'uncertain' })
          ], normalizeName, normalizeList);
          equal(conversion.pokemon_list, '超夢');
          equal(conversion.recognized_count, 1);
          equal(conversion.uncertain_count, 1);

          const unknownSpecies = smartHundoCardsToPokemonList([
            card({ official_name: '未知', recognition_status: 'uncertain' })
          ], normalizeName, normalizeList);
          equal(unknownSpecies.pokemon_list, '');
          equal(unknownSpecies.recognized_count, 0);
          equal(unknownSpecies.uncertain_count, 1);
        });

        test('preserves partial recognition while excluding it from the usable list', () => {
          const normalized = normalizeSmartHundoResult({
            cards: [card({ recognition_status: 'partial', official_name: '超夢' })]
          }, normalizeNumber, normalizeName);
          equal(normalized.cards[0].recognition_status, 'partial');
          const conversion = smartHundoCardsToPokemonList(normalized.cards, normalizeName, normalizeList);
          equal(conversion.pokemon_list, '');
          equal(conversion.recognized_count, 0);
          equal(conversion.uncertain_count, 1);
        });

        test('merges multiple results and reports hundo leg conflicts', () => {
          const merged = mergeSmartHundoScanResults([
            { hundo_leg: '8', detected_card_count: 2, cards: [card({ official_name: '超夢' })] },
            { hundo_leg: '9', detected_card_count: 1, cards: [card({ official_name: '夢幻', order: 2, shiny_state: 'yes' })] }
          ], normalizeNumber, normalizeName, normalizeList);
          equal(merged.hundo_leg, '8');
          equal(merged.hundo_leg_conflict, true);
          equal(merged.detected_card_count, 3);
          equal(merged.recognized_count, 2);
          equal(merged.uncertain_count, 0);
          equal(merged.pokemon_list, '超夢,色違夢幻');
        });

        test('preserves identical same-position cards from different screenshots', () => {
          const duplicateAcrossScreenshots = card({ official_name: '超夢', order: 1, row: 1, column: 1 });
          const merged = mergeSmartHundoScanResults([
            { hundo_leg: '8', detected_card_count: 1, cards: [duplicateAcrossScreenshots] },
            { hundo_leg: '8', detected_card_count: 1, cards: [{ ...duplicateAcrossScreenshots }] }
          ], normalizeNumber, normalizeName, normalizeCountingList);
          equal(merged.pokemon_list, '超夢*2');
          equal(merged.recognized_count, 2);
          equal(merged.cards.length, 2);
          equal(merged.detected_card_count, 2);
        });

        const indexRequest = new XMLHttpRequest();
        indexRequest.open('GET', '../index.html', false);
        indexRequest.send();
        const indexHtml = indexRequest.responseText;
        const moduleMatch = indexHtml.match(/<script type="module">([\s\S]*?)<\/script>/);
        if (!moduleMatch) fail('index module script is missing');
        equal(indexHtml.includes('<script src="smart-hundo-helpers.js"><' + '/script>'), true);

        const nativeCreateElement = document.createElement.bind(document);
        let canvasCalls = 0;
        let lastPayload = null;
        let smartRequestCount = 0;
        const fileReadCounts = new Map();
        const resizedByOriginal = new Map();
        const originalDataUrl = 'data:image/png;base64,SMART_ORIGINAL_DO_NOT_EXPOSE';
        const resizedUrl = 'data:image/jpeg;base64,RESIZED';
        const pngFile = { type: 'image/png', dataUrl: originalDataUrl };

        class MockFileReader {
          readAsDataURL(file) {
            if (file.id) fileReadCounts.set(file.id, (fileReadCounts.get(file.id) || 0) + 1);
            if (file.readerError) {
              this.onerror?.(new Event('error'));
              return;
            }
            this.onload?.({ target: { result: file.dataUrl } });
          }
        }

        class MockImage {
          set src(value) {
            this.source = value;
            if (String(value).includes('IMAGE_ERROR')) {
              this.onerror?.(new Event('error'));
              return;
            }
            this.width = 1600;
            this.height = 900;
            this.onload?.();
          }
        }

        globalThis.FileReader = MockFileReader;
        globalThis.Image = MockImage;
        document.createElement = (tagName, ...args) => {
          if (String(tagName).toLowerCase() !== 'canvas') return nativeCreateElement(tagName, ...args);
          canvasCalls += 1;
          let drawnImage = null;
          return {
            getContext: () => ({ drawImage: (image) => { drawnImage = image; } }),
            toDataURL: () => resizedByOriginal.get(drawnImage?.source) || resizedUrl
          };
        };
        globalThis.initializeApp = () => ({});
        globalThis.getDatabase = () => ({});
        globalThis.ref = () => ({});
        globalThis.set = async () => {};
        globalThis.push = () => ({});
        globalThis.onValue = () => {};
        globalThis.remove = async () => {};
        globalThis.update = async () => {};
        globalThis.fetch = async (_url, options = {}) => {
          lastPayload = JSON.parse(options.body);
          if (lastPayload.messages[0].content[1].image_url.detail === 'high') smartRequestCount += 1;
          return {
            ok: true,
            json: async () => ({
              choices: [{ message: { content: JSON.stringify({
                hundo_leg: '8',
                hundo_leg_confidence: 0.9,
                detected_card_count: 0,
                cards: []
              }) } }]
            })
          };
        };

        const pageModule = moduleMatch[1]
          .replace(/^\s*import\s+[^;]+;\s*$/gm, '')
          + '\nObject.assign(globalThis, { HUNDO_SMART_IMAGE_DETAIL, HUNDO_SMART_SCHEMA, buildSmartHundoPrompt, fileToOriginalDataUrl, fileToResizedDataUrl, buildAiRequestContent, requestOpenAiJsonSchema, requestSmartHundoExtraction, smartHundoScan });';
        (0, eval)(pageModule);

        equal(await fileToOriginalDataUrl(pngFile), pngFile.dataUrl);
        equal(canvasCalls, 0);
        await requestOpenAiJsonSchema('test-key', 'normal', resizedUrl, HUNDO_SMART_SCHEMA, null);
        equal(lastPayload.messages[0].content[1].image_url.detail, 'auto');
        await smartHundoScan({ apiKey: 'test-key', originalDataUrl, imageIndex: 2 });
        equal(lastPayload.messages[0].content[1].image_url.detail, 'high');
        equal(lastPayload.messages[0].content[1].image_url.url, originalDataUrl);
        equal(smartRequestCount, 1);
        equal(JSON.stringify(lastPayload).includes('test-key'), false);
        equal(HUNDO_SMART_IMAGE_DETAIL, 'high');
        equal(HUNDO_SMART_SCHEMA.strict, true);
        equal(HUNDO_SMART_SCHEMA.schema.additionalProperties, false);
        equal(HUNDO_SMART_SCHEMA.schema.properties.cards.items.additionalProperties, false);
        deepEqual(Object.keys(HUNDO_SMART_SCHEMA.schema.properties), ['hundo_leg', 'hundo_leg_confidence', 'detected_card_count', 'cards']);
        deepEqual(HUNDO_SMART_SCHEMA.schema.required, ['hundo_leg', 'hundo_leg_confidence', 'detected_card_count', 'cards']);
        const smartCardSchema = HUNDO_SMART_SCHEMA.schema.properties.cards.items;
        deepEqual(Object.keys(smartCardSchema.properties), [
          'order', 'row', 'column', 'visible_label', 'official_name', 'recognition_status', 'species_confidence',
          'shiny_state', 'shiny_confidence', 'purified_state', 'purified_confidence', 'shadow_state', 'shadow_confidence'
        ]);
        deepEqual(smartCardSchema.required, [
          'order', 'row', 'column', 'visible_label', 'official_name', 'recognition_status', 'species_confidence',
          'shiny_state', 'shiny_confidence', 'purified_state', 'purified_confidence', 'shadow_state', 'shadow_confidence'
        ]);
        deepEqual(smartCardSchema.properties.recognition_status.enum, ['recognized', 'partial', 'uncertain']);
        ['shiny_state', 'purified_state', 'shadow_state'].forEach(field => {
          deepEqual(smartCardSchema.properties[field].enum, ['yes', 'no', 'uncertain'], field);
        });
        const smartPrompt = buildSmartHundoPrompt();
        [
          'HUNDO_LEGENDARY_SCREEN', '傳說的寶可夢,幻,究極異獸&4*', '禁止重新分類', '所有可見的寶可夢卡片',
          '部分可見', '由上到下、由左到右', '官方繁體中文名稱', 'visible_label', '次要佐證', '不能取代視覺辨識',
          'shiny、purified、shadow', '分別獨立判斷', 'uncertain', '搜尋欄', '非寶可夢卡片', '不可見卡片', '重複卡片',
          'JSON Schema', '不得輸出 Markdown', '額外欄位'
        ].forEach(fragment => equal(smartPrompt.includes(fragment), true, `smart prompt protects ${fragment}`));
        [
          'recognized：僅在實際物種與型態可可靠辨識時使用',
          'partial：僅在卡片或證據只部分可見且辨識未完成時使用',
          '除非物種本身仍可可靠辨識，否則 official_name 留空',
          'uncertain：僅在證據衝突或過於模糊而無法可靠辨識時使用'
        ].forEach(fragment => equal(smartPrompt.includes(fragment), true, `smart prompt defines ${fragment}`));
        test('contains the complete A-G smart prompt contract', () => {
          const requiredBySection = {
            A: [
              '【A. 卡片列舉與位置】', '完整可見或部分可見', '由上到下、由左到右', 'order 必須從 1 開始',
              '不得依賴圖片上傳順序', '不得把相鄰卡片合併', '不得把相鄰卡片的符號或狀態指派給本卡'
            ],
            B: [
              '【B. 物種與型態辨識】', '身體、頭部、四肢、翅膀、尾巴、角', '型態專屬特徵',
              '傳說、幻與究極異獸的設計特徵', '顏色只能作為輔助證據', '自訂暱稱',
              'IV、151515、100、百分比', '縮寫、背景、招式、使用者符號、前綴或後綴',
              '絕對不得直接複製到 official_name', 'GLO蒼響151515 -> 蒼響', '官方繁體中文名稱與型態名稱',
              '證據衝突', 'official_name 留空', '不得猜測或發明'
            ],
            C: [
              '【C. 色違 shiny】', 'CP／狀態區附近的官方色違閃光或狀態圖示', '只靠身體顏色不足',
              '背景閃光、最愛星號、夥伴徽章、按鈕、徽章及相鄰卡片符號', '不清楚時填 uncertain'
            ],
            D: [
              '【D. 淨化 purified】', '只屬於該卡片的官方淨化符號或淨化效果',
              '無關的藍色、季節、服裝、背景或相鄰卡片圖形', '只保留在內部結果', '絕不能轉成 shiny'
            ],
            E: [
              '【E. 暗影 shadow】', '只屬於該卡片的官方紫色火焰或煙霧', '紫色身體或相鄰卡片效果都不足'
            ],
            F: [
              '【F. 必須忽略的 UI 與裝飾】', '最愛、夥伴、搜尋、排序、儲存空間、背景、紀念、全域、服裝、季節、底部導覽、CP 排序'
            ],
            G: [
              '【G. Schema 與一致性】', '只輸出符合提供 JSON Schema 的 JSON', '不得遺漏可見卡片',
              '不得發明隱藏或畫面外卡片', '不得輸出重複卡片', '位置與 order 必須一致'
            ]
          };
          Object.entries(requiredBySection).forEach(([section, fragments]) => {
            fragments.forEach(fragment => equal(smartPrompt.includes(fragment), true, `smart prompt section ${section} includes ${fragment}`));
          });
          equal(smartPrompt.includes('所有狀態證據都必須屬於同一張正在判定的卡片'), true, 'same-card evidence ownership is explicit');
        });
        test('harness error channels serialize Error details and force failure', () => {
          const diagnostics = [];
          const recorder = createHarnessErrorRecorder(diagnostics);
          recorder.consoleError('console context', new Error('synthetic console error'));
          recorder.windowError({ error: new TypeError('synthetic window error'), message: 'fallback window message' });
          recorder.unhandledRejection({ reason: new RangeError('synthetic rejection') });

          deepEqual(diagnostics.map(diagnostic => diagnostic.channel), [
            'console.error', 'window.error', 'unhandledrejection'
          ]);
          const serializedError = diagnostics[0].arguments[1];
          equal(serializedError.name, 'Error');
          equal(serializedError.message, 'synthetic console error');
          equal(typeof serializedError.stack, 'string');
          equal(serializedError.stack.includes('synthetic console error'), true);
          diagnostics.forEach(diagnostic => {
            equal(deriveHarnessStatus('pass', 0, [diagnostic]), 'fail', `${diagnostic.channel} forces failure`);
          });
          equal(deriveHarnessStatus('pass', 0, []), 'pass');
        });
        for (const type of ['image/jpeg', 'image/gif', 'image/webp']) {
          const dataUrl = `data:${type};base64,ORIGINAL_${type}`;
          equal(await fileToOriginalDataUrl({ type, dataUrl }), dataUrl, `accepts ${type}`);
        }
        await assertRejects(fileToOriginalDataUrl({ type: 'text/plain', dataUrl: originalDataUrl }), '支援的圖片格式', originalDataUrl);
        await assertRejects(fileToOriginalDataUrl({ type: 'image/png', dataUrl: originalDataUrl, readerError: true }), '讀取圖片失敗', originalDataUrl);
        await assertRejects(fileToResizedDataUrl({ type: 'image/png', dataUrl: originalDataUrl, readerError: true }), '讀取圖片失敗', originalDataUrl);
        await assertRejects(fileToResizedDataUrl({ type: 'image/png', dataUrl: 'data:image/png;base64,IMAGE_ERROR' }), '載入圖片失敗', 'IMAGE_ERROR');

        const fixtureIds = [
          'openaiApiKey', 'imageInput', 'aiAutoBtn', 'aiAutoStatus', 'g_hundos',
          'g_level', 'g_team', 'g_xp', 'g_stardust',
          'st_hundo_leg', 'st_shiny', 'st_coin', 'st_poke_bag', 'st_item_bag',
          'st_rarecandy', 'st_greenpass', 'st_masterball', 'st_old_poke',
          ...Array.from({ length: 11 }, (_, index) => `chk_sp_${index + 1}`),
          'chk_kyurem', 'sel_kyurem', 'chk_zamazenta', 'sel_dogs',
          'chk_necrozma', 'sel_necrozma', 'chk_lati', 'sel_lati',
          'chk_hoenn', 'sel_hoenn', 'chk_dyna', 'chk_groudon', 'chk_kyogre', 'chk_rayquaza'
        ];
        fixtureIds.forEach(id => {
          if (document.getElementById(id)) return;
          const isStatus = id === 'aiAutoStatus';
          const isButton = id === 'aiAutoBtn';
          const isCheckbox = id.startsWith('chk_');
          const element = nativeCreateElement(isStatus ? 'p' : isButton ? 'button' : id === 'g_hundos' ? 'textarea' : 'input');
          element.id = id;
          if (isCheckbox) element.type = 'checkbox';
          document.body.appendChild(element);
        });
        document.getElementById('openaiApiKey').value = 'test-key';

        const makeFile = (id) => ({
          id,
          type: 'image/png',
          dataUrl: `data:image/png;base64,ORIGINAL_${id}`
        });
        const setScanFiles = (ids) => {
          const files = ids.map(makeFile);
          files.forEach(file => resizedByOriginal.set(file.dataUrl, `data:image/jpeg;base64,RESIZED_${file.id}`));
          Object.defineProperty(document.getElementById('imageInput'), 'files', {
            configurable: true,
            value: files
          });
          return files;
        };
        const openAiResponse = (content, onJson) => ({
          ok: true,
          json: async () => {
            onJson?.();
            return { choices: [{ message: { content: JSON.stringify(content) } }] };
          }
        });
        const classificationByImage = {
          PROFILE: { image_type: 'TRAINER_PROFILE_SCREEN', search_query: '' },
          HUNDO: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢,幻,究極異獸&4*' },
          HUNDO_A: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢，幻，究極異獸＆4＊' },
          HUNDO_B: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: ' 傳說的寶可夢, 幻, 究極異獸 & 4* ' },
          RAW_OTHER_HUNDO: { image_type: 'OTHER', search_query: '傳說的寶可夢,幻,究極異獸&4*' },
          CONFLICT_HUNDO: { image_type: 'SHINY_CATEGORY_SCREEN', search_query: '傳說的寶可夢,幻,究極異獸&4*' },
          RAW_HUNDO_FULL: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '　傳說的寶可夢， 幻， 究極異獸 ＆ ４＊ ' },
          RAW_OTHER_OLD: { image_type: 'OTHER', search_query: ' 年１６-２０ ' },
          SHINY: { image_type: 'SHINY_CATEGORY_SCREEN', search_query: '' },
          RESOURCE: { image_type: 'RESOURCE_SCREEN', search_query: '' }
        };
        const extractionForPrompt = (prompt) => {
          if (prompt.includes('image_type = TRAINER_PROFILE_SCREEN')) return { level: '50', team: '紅隊', xp: '3500000' };
          if (prompt.includes('image_type = SHINY_CATEGORY_SCREEN')) return { shiny: '77' };
          if (prompt.includes('image_type = OLD_POKEMON_SCREEN')) return { old_poke: '42' };
          if (prompt.includes('image_type = RESOURCE_SCREEN')) {
            return { coin: '123', poke_bag: '7800', item_bag: '6800', rarecandy: '45', greenpass: '6', masterball: '2' };
          }
          fail(`unexpected ordinary extraction prompt: ${prompt.slice(0, 120)}`);
        };
        const smartResult = {
          hundo_leg: '8',
          hundo_leg_confidence: 0.93,
          detected_card_count: 3,
          cards: [
            card({ official_name: '超夢' }),
            card({ order: 2, row: 1, column: 2, official_name: '夢幻', shiny_state: 'yes' }),
            card({ order: 3, row: 2, column: 1, official_name: '', recognition_status: 'uncertain', species_confidence: 0.2 })
          ]
        };
        const smartResultByImage = {
          HUNDO: smartResult,
          HUNDO_A: {
            hundo_leg: '8',
            hundo_leg_confidence: 0.91,
            detected_card_count: 1,
            cards: [card({ official_name: ' 超夢 ' })]
          },
          HUNDO_B: {
            hundo_leg: '9',
            hundo_leg_confidence: 0.89,
            detected_card_count: 1,
            cards: [card({ official_name: '夢幻', shiny_state: 'uncertain' })]
          },
          RAW_HUNDO_FULL: {
            hundo_leg: '8',
            hundo_leg_confidence: 0.95,
            detected_card_count: 1,
            cards: [card({ official_name: '蒼響' })]
          }
        };
        let routedRequests = [];
        let requestStageEvents = [];
        let failSmartRequests = false;
        let failedSmartIdentities = new Set();
        globalThis.alert = () => {};
        globalThis.setTimeout = (callback) => { callback(); return 0; };
        globalThis.fetch = async (_url, options = {}) => {
          const payload = JSON.parse(options.body);
          const schemaName = payload.response_format.json_schema.name;
          const prompt = payload.messages[0].content[0].text;
          const imageUrl = payload.messages[0].content[1].image_url.url;
          const detail = payload.messages[0].content[1].image_url.detail;
          routedRequests.push({ schemaName, prompt, imageUrl, detail });
          requestStageEvents.push({ event: 'start', schemaName });
          if (schemaName === 'pokemon_go_image_classifier') {
            const identity = imageUrl.match(/RESIZED_(.+)$/)?.[1];
            return openAiResponse(classificationByImage[identity], () => requestStageEvents.push({ event: 'finish', schemaName }));
          }
          if (schemaName === 'pokemon_go_hundo_smart_extractor') {
            const identity = imageUrl.match(/ORIGINAL_(.+)$/)?.[1];
            if (failSmartRequests || failedSmartIdentities.has(identity)) throw new Error('mock smart network failure');
            return openAiResponse(smartResultByImage[identity], () => requestStageEvents.push({ event: 'finish', schemaName }));
          }
          if (schemaName === 'pokemon_go_forced_field_extractor') {
            return openAiResponse(extractionForPrompt(prompt), () => requestStageEvents.push({ event: 'finish', schemaName }));
          }
          fail(`unexpected schema ${schemaName}`);
        };

        await asyncTest('routes arbitrary-order jobs after classification and merges smart cards safely', async () => {
          fileReadCounts.clear();
          routedRequests = [];
          requestStageEvents = [];
          failSmartRequests = false;
          failedSmartIdentities = new Set();
          setScanFiles(['PROFILE', 'HUNDO', 'SHINY', 'RESOURCE']);
          document.getElementById('g_hundos').value = '使用者舊值';

          await autoScan();

          const classifierRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_image_classifier');
          const ordinaryRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_forced_field_extractor');
          const smartRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor');
          equal(classifierRequests.length, 4, 'classifies every stable job first');
          equal(ordinaryRequests.length, 3, 'only normal jobs use ordinary extraction');
          equal(smartRequests.length, 1, 'one logical smart job request');
          equal(smartRequests[0].imageUrl, 'data:image/png;base64,ORIGINAL_HUNDO', 'smart extraction uses its original');
          equal(smartRequests[0].detail, 'high', 'smart extraction requests high detail');
          equal(ordinaryRequests.every(request => request.imageUrl.startsWith('data:image/jpeg;base64,RESIZED_')), true, 'normal jobs use resized data');
          equal(ordinaryRequests.some(request => request.imageUrl.includes('HUNDO')), false, 'smart image cannot enter ordinary extraction or validation');
          equal(ordinaryRequests.some(request => request.prompt.includes('allow_pokemon_list')), false, 'ordinary prompts do not expose the smart routing flag');
          equal(fileReadCounts.get('PROFILE'), 1, 'profile is read only for resizing');
          equal(fileReadCounts.get('HUNDO'), 2, 'hundo is read once for resizing and once as original');
          equal(fileReadCounts.get('SHINY'), 1, 'shiny is read only for resizing');
          equal(fileReadCounts.get('RESOURCE'), 1, 'resource is read only for resizing');
          equal(document.getElementById('g_level').value, '50');
          equal(document.getElementById('g_team').value, '紅隊');
          equal(document.getElementById('g_xp').value, '350');
          equal(document.getElementById('st_shiny').value, '77');
          equal(document.getElementById('st_coin').value, '123');
          equal(document.getElementById('g_hundos').value, '超夢,色違夢幻', 'pokemon list comes only from normalized smart cards');
          equal(document.getElementById('st_hundo_leg').value, '8');
          deepEqual(window.lastSmartHundoScanResult.screenshotIndexes, [1]);
          deepEqual(window.lastSmartHundoScanResult.failedIndexes, []);
          equal(window.lastSmartHundoScanResult.detectedCardCount, 3);
          equal(window.lastSmartHundoScanResult.recognizedCount, 2);
          equal(window.lastSmartHundoScanResult.uncertainCount, 1);
          equal(window.lastSmartHundoScanResult.cards[2].recognition_status, 'uncertain');
          equal(window.lastSmartHundoScanResult.screenshots[0].index, 1, 'audit keeps cards associated with their screenshot');
          equal(window.lastSmartHundoScanResult.screenshots[0].cards.length, 3);
          equal(window.lastSmartHundoScanResult.hundoLegConflict, false);
          equal(document.getElementById('aiAutoStatus').textContent.includes('1'), true, 'status shows manual-review count');
          equal(document.getElementById('aiAutoBtn').disabled, false, 'button is restored');
        });

        await asyncTest('requires both the raw hundo type and normalized exact query for smart routing', async () => {
          fileReadCounts.clear();
          routedRequests = [];
          requestStageEvents = [];
          failSmartRequests = false;
          failedSmartIdentities = new Set();
          setScanFiles(['RAW_OTHER_HUNDO', 'CONFLICT_HUNDO', 'RAW_HUNDO_FULL', 'RAW_OTHER_OLD']);
          document.getElementById('g_hundos').value = '舊百神';

          await autoScan();

          const classifierRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_image_classifier');
          const ordinaryRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_forced_field_extractor');
          const smartRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor');
          equal(classifierRequests.length, 4, 'all raw classifier results are exercised end to end');
          equal(ordinaryRequests.length, 1, 'ordinary non-hundo query inference remains enabled');
          equal(ordinaryRequests[0].prompt.includes('image_type = OLD_POKEMON_SCREEN'), true);
          equal(ordinaryRequests[0].imageUrl, 'data:image/jpeg;base64,RESIZED_RAW_OTHER_OLD');
          deepEqual(smartRequests.map(request => request.imageUrl), [
            'data:image/png;base64,ORIGINAL_RAW_HUNDO_FULL'
          ], 'query-only inference never creates a smart request');
          equal(fileReadCounts.get('RAW_OTHER_HUNDO'), 1, 'raw OTHER never reads the original image');
          equal(fileReadCounts.get('CONFLICT_HUNDO'), 1, 'conflicting non-hundo type never reads the original image');
          equal(fileReadCounts.get('RAW_HUNDO_FULL'), 2, 'raw hundo with normalized exact query uses its original image');
          equal(fileReadCounts.get('RAW_OTHER_OLD'), 1, 'ordinary inferred search type remains on the resized path');
          deepEqual(window.lastSmartHundoScanResult.screenshotIndexes, [2]);
          equal(document.getElementById('g_hundos').value, '蒼響');
        });

        await asyncTest('normalizes full-width routing and merges multiple smart screenshots conservatively', async () => {
          fileReadCounts.clear();
          routedRequests = [];
          requestStageEvents = [];
          failSmartRequests = false;
          failedSmartIdentities = new Set();
          setScanFiles(['HUNDO_A', 'PROFILE', 'HUNDO_B']);
          document.getElementById('g_hundos').value = '舊百神';
          document.getElementById('st_hundo_leg').value = '';
          document.getElementById('g_level').value = '';

          await autoScan();

          const classifierRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_image_classifier');
          const extractionRequests = routedRequests.filter(request => request.schemaName !== 'pokemon_go_image_classifier');
          const smartRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor');
          const firstExtractionStart = requestStageEvents.findIndex(event => event.event === 'start' && event.schemaName !== 'pokemon_go_image_classifier');
          const lastClassificationFinish = requestStageEvents.reduce((lastIndex, event, index) => (
            event.event === 'finish' && event.schemaName === 'pokemon_go_image_classifier' ? index : lastIndex
          ), -1);
          equal(classifierRequests.length, 3);
          equal(lastClassificationFinish < firstExtractionStart, true, 'all classification responses finish before extraction starts');
          equal(extractionRequests.length, 3, 'one ordinary and two smart extractions run');
          deepEqual(smartRequests.map(request => request.imageUrl), [
            'data:image/png;base64,ORIGINAL_HUNDO_A',
            'data:image/png;base64,ORIGINAL_HUNDO_B'
          ], 'each smart job reads its own exact original');
          equal(smartRequests.every(request => request.detail === 'high'), true);
          equal(fileReadCounts.get('HUNDO_A'), 2);
          equal(fileReadCounts.get('HUNDO_B'), 2);
          equal(document.getElementById('st_hundo_leg').value, '8', 'first valid hundo count is kept instead of summed');
          equal(document.getElementById('st_hundo_leg').value === '17', false, 'conflicting hundo counts are never summed');
          equal(document.getElementById('g_hundos').value, '超夢,夢幻');
          equal(document.getElementById('g_level').value, '50');
          equal(document.getElementById('aiAutoStatus').textContent.includes('百神數有衝突'), true, 'status reports hundo conflict');
          equal(document.getElementById('aiAutoStatus').textContent.includes('1 張卡片需人工確認'), true, 'status also reports manual-review count');
          deepEqual(window.lastSmartHundoScanResult.screenshotIndexes, [0, 2]);
          deepEqual(window.lastSmartHundoScanResult.screenshots.map(screenshot => screenshot.index), [0, 2]);
          equal(window.lastSmartHundoScanResult.screenshots[0].cards[0].official_name, '超夢');
          equal(window.lastSmartHundoScanResult.screenshots[1].cards[0].official_name, '夢幻');
          equal(window.lastSmartHundoScanResult.hundoLeg, '8');
          equal(window.lastSmartHundoScanResult.hundoLegConflict, true);
          equal(window.lastSmartHundoScanResult.uncertainCount, 1);
        });

        await asyncTest('keeps successful smart audit and edited list when another smart job fails', async () => {
          fileReadCounts.clear();
          routedRequests = [];
          requestStageEvents = [];
          failSmartRequests = false;
          failedSmartIdentities = new Set(['HUNDO_B']);
          setScanFiles(['HUNDO_A', 'PROFILE', 'HUNDO_B']);
          document.getElementById('g_hundos').value = '手動保留百神';
          document.getElementById('g_level').value = '';
          document.getElementById('st_hundo_leg').value = '';

          await autoScan();

          const smartRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor');
          equal(smartRequests.filter(request => request.imageUrl.endsWith('ORIGINAL_HUNDO_A')).length, 1, 'successful smart job has one logical request');
          equal(smartRequests.filter(request => request.imageUrl.endsWith('ORIGINAL_HUNDO_B')).length, 3, 'failed smart job exhausts bounded wrapper retries');
          equal(document.getElementById('g_level').value, '50', 'ordinary fields survive partial smart failure');
          equal(document.getElementById('st_hundo_leg').value, '8', 'successful smart hundo count remains usable');
          equal(document.getElementById('g_hundos').value, '手動保留百神', 'any smart failure preserves edited list');
          deepEqual(window.lastSmartHundoScanResult.screenshotIndexes, [0, 2]);
          deepEqual(window.lastSmartHundoScanResult.failedIndexes, [2]);
          deepEqual(window.lastSmartHundoScanResult.screenshots.map(screenshot => screenshot.index), [0]);
          equal(window.lastSmartHundoScanResult.cards[0].official_name, '超夢');
          equal(document.getElementById('aiAutoStatus').textContent.includes('智慧百神辨識失敗'), true);
          const serializedAudit = JSON.stringify(window.lastSmartHundoScanResult);
          ['test-key', 'Authorization', 'ORIGINAL_', 'RESIZED_', 'data:image/', 'classificationDataUrl', 'file'].forEach(secret => {
            equal(serializedAudit.includes(secret), false, `audit excludes ${secret}`);
          });
        });

        await asyncTest('preserves ordinary output and edited hundo list when smart retries fail', async () => {
          fileReadCounts.clear();
          routedRequests = [];
          requestStageEvents = [];
          failSmartRequests = true;
          failedSmartIdentities = new Set();
          setScanFiles(['PROFILE', 'HUNDO']);
          document.getElementById('g_hundos').value = '手動編輯百神';
          document.getElementById('g_level').value = '';
          document.getElementById('aiAutoStatus').textContent = '';

          await autoScan();

          const smartRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor');
          equal(smartRequests.length, 3, 'shared wrapper performs its bounded smart retries');
          equal(document.getElementById('g_level').value, '50', 'completed ordinary fields remain applied');
          equal(document.getElementById('g_hundos').value, '手動編輯百神', 'failed smart work preserves edited list');
          equal(document.getElementById('aiAutoBtn').disabled, false, 'failure restores button');
          equal(document.getElementById('aiAutoStatus').textContent.includes('智慧百神辨識失敗'), true, 'failure status is explicit');
          equal(document.getElementById('aiAutoStatus').textContent.includes('合併完成'), false, 'failure status is not success');
          deepEqual(window.lastSmartHundoScanResult.screenshotIndexes, [1]);
          deepEqual(window.lastSmartHundoScanResult.failedIndexes, [1]);
          equal(window.lastSmartHundoScanResult.cards.length, 0);
          equal(window.lastSmartHundoScanResult.screenshots.length, 0);
        });

        const serializedLogs = JSON.stringify(loggedValues);
        equal(serializedLogs.includes('test-key'), false, 'logs omit the API key');
        equal(serializedLogs.includes('data:image/'), false, 'logs omit image data URLs');

        executionStatus = 'pass';
      } catch (error) {
        results.push(`FAIL ${error && error.message ? error.message : String(error)}`);
        executionStatus = 'fail';
      }

      await new Promise(resolve => nativeSetTimeout(resolve, 0));
      renderTestSummary();
    })();
  </script>
</body>
</html>
