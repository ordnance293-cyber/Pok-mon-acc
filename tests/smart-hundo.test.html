<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart hundo helper tests</title>
  <script src="../smart-hundo-helpers.js"></script>
</head>
<body data-test-status="running">
  <pre id="results"></pre>
  <script>
    (async () => {
      'use strict';

      const results = [];
      const loggedValues = [];
      const unexpectedDiagnostics = [];
      const nativeSetTimeout = globalThis.setTimeout.bind(globalThis);
      let executionStatus = 'running';
      const serializeHarnessValue = (value, seen = new WeakSet()) => {
        if (value instanceof Error) {
          return {
            name: String(value.name || 'Error'),
            message: String(value.message || ''),
            stack: String(value.stack || '')
          };
        }
        if (value === null || ['string', 'number', 'boolean'].includes(typeof value)) return value;
        if (['undefined', 'bigint', 'symbol', 'function'].includes(typeof value)) return String(value);
        if (seen.has(value)) return '[Circular]';
        seen.add(value);
        if (Array.isArray(value)) return value.map(item => serializeHarnessValue(item, seen));
        try {
          return Object.fromEntries(
            Object.entries(value).map(([key, item]) => [key, serializeHarnessValue(item, seen)])
          );
        } catch (error) {
          return {
            name: 'UnserializableValue',
            message: String(error && error.message ? error.message : error),
            stack: ''
          };
        }
      };
      const createHarnessErrorRecorder = (target, onRecord = () => {}) => {
        const record = (channel, args) => {
          const diagnostic = {
            channel,
            arguments: args.map(argument => serializeHarnessValue(argument))
          };
          target.push(diagnostic);
          onRecord();
          return diagnostic;
        };
        return {
          consoleError: (...args) => record('console.error', args),
          windowError: (event = {}) => record('window.error', [
            event.error instanceof Error
              ? event.error
              : { name: 'Error', message: String(event.message || 'Unknown window error'), stack: '' }
          ]),
          unhandledRejection: (event = {}) => record('unhandledrejection', [
            event.reason === undefined ? 'Unknown unhandled rejection' : event.reason
          ])
        };
      };
      const deriveHarnessStatus = (status, failedCount, diagnostics) => (
        status === 'pass' && failedCount === 0 && diagnostics.length === 0 ? 'pass' : 'fail'
      );
      const renderTestSummary = () => {
        const passedCount = results.filter(result => result.startsWith('PASS ')).length;
        const assertionFailures = results.filter(result => result.startsWith('FAIL '));
        const diagnosticFailures = unexpectedDiagnostics.map(diagnostic => (
          `FAIL ${diagnostic.channel}: ${JSON.stringify(diagnostic.arguments)}`
        ));
        const failedCount = assertionFailures.length + diagnosticFailures.length;
        document.body.dataset.testPassed = String(passedCount);
        document.body.dataset.testFailed = String(failedCount);
        document.body.dataset.testStatus = deriveHarnessStatus(executionStatus, failedCount, unexpectedDiagnostics);
        document.getElementById('results').textContent = [...results, ...diagnosticFailures].join('\n');
      };
      const harnessErrorRecorder = createHarnessErrorRecorder(unexpectedDiagnostics, renderTestSummary);
      window.addEventListener('error', harnessErrorRecorder.windowError);
      window.addEventListener('unhandledrejection', harnessErrorRecorder.unhandledRejection);
      console.log = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.warn = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.error = (...args) => {
        loggedValues.push(args.map(argument => serializeHarnessValue(argument)));
        harnessErrorRecorder.consoleError(...args);
      };
      const fail = (message) => { throw new Error(message); };
      const equal = (actual, expected, message = 'values differ') => {
        if (actual !== expected) fail(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      };
      const deepEqual = (actual, expected, message = 'values differ') => {
        const actualJson = JSON.stringify(actual);
        const expectedJson = JSON.stringify(expected);
        if (actualJson !== expectedJson) fail(`${message}: expected ${expectedJson}, got ${actualJson}`);
      };
      const test = (name, callback) => {
        callback();
        results.push(`PASS ${name}`);
      };
      const asyncTest = async (name, callback) => {
        await callback();
        results.push(`PASS ${name}`);
      };
      const sparkleEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        color: 'none',
        shape: 'none',
        ...overrides
      });
      const appearanceEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        appearance: 'none',
        ...overrides
      });
      const luckyEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        appearance: 'none',
        ...overrides
      });
      const rocketEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        color: 'none',
        shape: 'none',
        ...overrides
      });
      const backgroundEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        badge_type: 'none',
        appearance: 'none',
        ...overrides
      });
      const cyanPurificationEvidence = () => ({
        present: true,
        region_visibility: 'clear',
        position: 'lower_left',
        color: 'light_cyan',
        shape: 'single_radial_sparkle'
      });
      const card = (overrides = {}) => ({
        order: 1,
        row: 1,
        column: 1,
        visible_label: '畫面名稱',
        official_name: '超夢',
        recognition_status: 'recognized',
        species_confidence: 0.9,
        cp: 1234,
        shiny_state: 'no',
        shiny_confidence: 0.9,
        shiny_evidence: sparkleEvidence(),
        lucky_state: 'no',
        lucky_confidence: 0.9,
        lucky_evidence: luckyEvidence(),
        favorite_state: 'no',
        favorite_confidence: 0.9,
        favorite_evidence: appearanceEvidence(),
        rocket_state: 'normal',
        rocket_confidence: 0.9,
        rocket_evidence: rocketEvidence(),
        background_type: 'none',
        background_confidence: 0.9,
        background_evidence: backgroundEvidence(),
        purified_state: 'no',
        purified_confidence: 0.9,
        shadow_state: 'no',
        shadow_confidence: 0.9,
        ...overrides
      });
      const validatedCard = (overrides = {}) => ({
        ...card(),
        screenshot_index: 0,
        card_id: '0:1:1:1',
        effective_shiny_state: 'no',
        effective_lucky_state: 'no',
        effective_favorite_state: 'no',
        effective_rocket_state: 'normal',
        effective_background_type: 'none',
        manual_review_reasons: [],
        ...overrides
      });
      const normalizeName = (value) => String(value ?? '').trim().replace(/^官方:/, '');
      const assertRejects = async (promise, expectedMessage, forbiddenValue) => {
        try {
          await promise;
          fail('expected promise to reject');
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          if (!message.includes(expectedMessage)) fail(`expected error containing ${JSON.stringify(expectedMessage)}, got ${JSON.stringify(message)}`);
          if (forbiddenValue && message.includes(forbiddenValue)) fail('error message exposed the data URL');
        }
      };

      try {
        const helpers = globalThis.SmartHundoHelpers;
        if (!helpers) fail('SmartHundoHelpers is missing');
        const {
          normalizeSearchQuery,
          isSmartHundoClassification,
          partitionImageJobs,
          adaptLegacyRocketState,
          normalizeSmartHundoCard,
          normalizeSmartHundoResult: normalizeSmartHundoResultV2,
          validateSmartHundoStructure,
          buildHundoDisplayName,
          smartHundoCardsToPokemonList: effectiveSmartHundoCardsToPokemonList,
          summarizeHundoManualReview,
          HUNDO_REVIEW_REASON_MESSAGES,
          HUNDO_COUNT_CONFIDENCE_THRESHOLD,
          SPECIES_CONFIDENCE_THRESHOLD,
          STATE_YES_CONFIDENCE_THRESHOLD,
          STATE_NEGATIVE_CONFIDENCE_THRESHOLD,
          ENUMERATION_CONFIDENCE_THRESHOLD,
          isValidShinyEvidence,
          isValidLuckyEvidence,
          isValidFavoriteEvidence,
          deriveRocketStateFromEvidence,
          deriveBackgroundTypeFromEvidence,
          validateHundoCardStates,
          normalizeHundoCountResult,
          validateHundoCountEvidence,
          mergeHundoCountResults,
          normalizeVisibleLabel,
          detectScreenshotOverlap,
          mergeSmartHundoScreenshots,
          shapeSmartHundoDiagnostics
        } = helpers;
        const normalizedCard = (overrides = {}) => normalizeSmartHundoCard(
          card(overrides),
          normalizeName,
          { screenshotIndex: 0 }
        );
        const makeCards = (count, overrides = {}) => Array.from({ length: count }, (_, index) => card({
          order: index + 1,
          row: Math.floor(index / 3) + 1,
          column: (index % 3) + 1,
          ...overrides
        }));

        test('normalizes each required hundo query variant', () => {
          const canonical = '傳說的寶可夢,幻,究極異獸&4*';
          const variants = [
            ['full-width punctuation', '傳說的寶可夢，幻，究極異獸＆4＊'],
            ['unicode whitespace', '\u3000傳說的寶可夢,\n幻,\t究極異獸&4*\u00a0'],
            ['mixed width punctuation', '傳說的寶可夢，幻，究極異獸＆４＊']
          ];
          variants.forEach(([name, value]) => equal(normalizeSearchQuery(value), canonical, name));
        });

        test('partitions only the exact hundo classification route', () => {
          const jobs = [
            { index: 0, classification: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢,幻,究極異獸&異色&4*' } },
            { index: 1, classification: { image_type: 'HUNDO_LEGENDARY_SCREEN', search_query: '傳說的寶可夢，幻，究極異獸＆4＊' } },
            { index: 2, classification: { image_type: 'OTHER', search_query: '傳說的寶可夢,幻,究極異獸&4*' } }
          ];
          const partitioned = partitionImageJobs(jobs);
          deepEqual(partitioned.smartHundoJobs.map(job => job.index), [1]);
          deepEqual(partitioned.normalJobs.map(job => job.index), [0, 2]);
          equal(isSmartHundoClassification(jobs[1].classification), true);
          equal(isSmartHundoClassification(jobs[0].classification), false);
        });

        test('expresses seven features through five state dimensions', () => {
          const normalized = normalizeSmartHundoCard(card({
            shiny_state: 'yes',
            lucky_state: 'yes',
            favorite_state: 'yes',
            rocket_state: 'purified',
            background_type: 'special'
          }), normalizeName, { screenshotIndex: 4 });
          equal(normalized.shiny_state, 'yes');
          equal(normalized.lucky_state, 'yes');
          equal(normalized.favorite_state, 'yes');
          equal(normalized.rocket_state, 'purified');
          equal(normalized.background_type, 'special');
          equal(normalized.effective_shiny_state, 'uncertain');
          equal(normalized.card_id, '4:1:1:1');
        });

        test('preserves dedicated evidence, CP text, and review fields on normalized cards', () => {
          const normalized = normalizeSmartHundoCard(card({
            cp: 3104,
            shiny_evidence: sparkleEvidence({ position: 'around_pokemon', color: 'blue_black', shape: 'other' }),
            lucky_evidence: luckyEvidence({ present: true, position: 'behind_pokemon', appearance: 'large_gold_shimmering_background' }),
            favorite_evidence: appearanceEvidence({ present: true, position: 'upper_right', appearance: 'other' }),
            rocket_evidence: rocketEvidence({ present: true, position: 'lower_side', color: 'light_blue', shape: 'purification_starburst' }),
            background_evidence: backgroundEvidence({
              present: true,
              position: 'near_pokemon_or_card_background',
              badge_type: 'special_background_badge',
              appearance: 'event_special_background'
            })
          }), normalizeName, { screenshotIndex: 2 });
          equal(normalized.cp, '3104');
          deepEqual(normalized.shiny_evidence, sparkleEvidence({ position: 'around_pokemon', color: 'blue_black', shape: 'other' }));
          deepEqual(normalized.lucky_evidence, luckyEvidence({ present: true, position: 'behind_pokemon', appearance: 'large_gold_shimmering_background' }));
          deepEqual(normalized.favorite_evidence, appearanceEvidence({ present: true, position: 'upper_right', appearance: 'other' }));
          deepEqual(normalized.rocket_evidence, rocketEvidence({ present: true, position: 'lower_side', color: 'light_blue', shape: 'purification_starburst' }));
          deepEqual(normalized.background_evidence, backgroundEvidence({
            present: true,
            position: 'near_pokemon_or_card_background',
            badge_type: 'special_background_badge',
            appearance: 'event_special_background'
          }));
          deepEqual(normalized.manual_review_reasons, []);
          deepEqual(normalized.raw.evidence.lucky, normalized.lucky_evidence);
          equal(normalized.card_id, '2:1:1:1');
        });

        test('adapts legacy shadow and purified into one rocket state', () => {
          equal(adaptLegacyRocketState({ shadow_state: 'yes', purified_state: 'no' }), 'shadow');
          equal(adaptLegacyRocketState({ shadow_state: 'no', purified_state: 'yes' }), 'purified');
          equal(adaptLegacyRocketState({ shadow_state: 'yes', purified_state: 'yes' }), 'uncertain');
          equal(adaptLegacyRocketState({ shadow_state: 'no', purified_state: 'no' }), 'normal');
          equal(adaptLegacyRocketState({ shadow_state: 'yes' }), 'uncertain');
        });

        test('rejects global without converting it to commemorative', () => {
          const normalized = normalizeSmartHundoCard(card({ background_type: 'global' }), normalizeName);
          equal(normalized.raw.states.background, 'global');
          equal(normalized.background_type, 'uncertain');
          equal(normalized.effective_background_type, 'uncertain');
        });

        test('exports the centralized confidence thresholds', () => {
          equal(HUNDO_COUNT_CONFIDENCE_THRESHOLD, 0.85);
          equal(SPECIES_CONFIDENCE_THRESHOLD, 0.80);
          equal(STATE_YES_CONFIDENCE_THRESHOLD, 0.85);
          equal(STATE_NEGATIVE_CONFIDENCE_THRESHOLD, 0.75);
          equal(ENUMERATION_CONFIDENCE_THRESHOLD, 0.85);
        });

        test('accepts only exact dedicated evidence for shiny, lucky, and favorite', () => {
          ['dark_blue', 'blue_black', 'teal_blue', 'dark_blue_teal'].forEach(color => {
            equal(isValidShinyEvidence(sparkleEvidence({
              present: true,
              position: 'cp_area',
              color,
              shape: 'multiple_four_point_sparkles'
            })), true, `accepts ${color} CP-area shiny evidence`);
          });
          equal(isValidShinyEvidence(cyanPurificationEvidence()), false, 'purification sparkle is not shiny');
          equal(isValidShinyEvidence(sparkleEvidence({
            present: true,
            position: 'around_pokemon',
            color: 'dark_blue',
            shape: 'multiple_four_point_sparkles'
          })), false, 'sparkles outside the CP area are not shiny evidence');
          equal(isValidLuckyEvidence(luckyEvidence({
            present: true,
            position: 'behind_pokemon',
            appearance: 'large_gold_shimmering_background'
          })), true);
          equal(isValidLuckyEvidence(luckyEvidence({
            present: true,
            position: 'behind_pokemon',
            appearance: 'other'
          })), false, 'a generic gold appearance is not lucky evidence');
          equal(isValidFavoriteEvidence(appearanceEvidence({
            present: true,
            position: 'upper_right',
            appearance: 'filled_yellow_five_point_star'
          })), true);
          equal(isValidFavoriteEvidence(appearanceEvidence({
            present: true,
            position: 'upper_right',
            appearance: 'other'
          })), false, 'a generic upper-right mark is not favorite evidence');
        });

        test('derives only exact purified, shadow, commemorative, and special evidence', () => {
          equal(deriveRocketStateFromEvidence(cyanPurificationEvidence()), 'purified');
          equal(deriveRocketStateFromEvidence(rocketEvidence({
            present: true,
            position: 'lower_side',
            color: 'light_blue',
            shape: 'purification_starburst'
          })), 'purified');
          equal(deriveRocketStateFromEvidence(rocketEvidence({
            present: true,
            position: 'around_pokemon',
            color: 'purple',
            shape: 'shadow_aura'
          })), 'shadow');
          equal(deriveRocketStateFromEvidence(rocketEvidence({
            present: true,
            position: 'lower_left',
            color: 'purple',
            shape: 'purple_flame'
          })), 'shadow');
          equal(deriveRocketStateFromEvidence(rocketEvidence({
            present: true,
            position: 'lower_side',
            color: 'purple',
            shape: 'shadow_aura'
          })), 'uncertain', 'lower-side shadow evidence is not an approved pattern');
          equal(deriveRocketStateFromEvidence(rocketEvidence()), 'normal');

          equal(deriveBackgroundTypeFromEvidence(backgroundEvidence({
            present: true,
            position: 'near_pokemon_or_card_background',
            badge_type: 'commemorative_location_badge',
            appearance: 'location_style_background'
          })), 'commemorative');
          equal(deriveBackgroundTypeFromEvidence(backgroundEvidence({
            present: true,
            position: 'near_pokemon_or_card_background',
            badge_type: 'special_background_badge',
            appearance: 'event_special_background'
          })), 'special');
          equal(deriveBackgroundTypeFromEvidence(backgroundEvidence({
            present: true,
            position: 'near_pokemon_or_card_background',
            badge_type: 'commemorative_location_badge',
            appearance: 'event_special_background'
          })), 'uncertain', 'mixed background evidence cannot infer a type');
          equal(deriveBackgroundTypeFromEvidence(backgroundEvidence()), 'none');
        });

        test('validates every positive state only at the yes confidence threshold', () => {
          const positiveCases = [
            {
              field: 'effective_shiny_state',
              expected: 'yes',
              stateKey: 'shiny_state',
              confidenceKey: 'shiny_confidence',
              evidenceKey: 'shiny_evidence',
              evidence: sparkleEvidence({
                present: true,
                position: 'cp_area',
                color: 'dark_blue_teal',
                shape: 'multiple_four_point_sparkles'
              })
            },
            {
              field: 'effective_lucky_state',
              expected: 'yes',
              stateKey: 'lucky_state',
              confidenceKey: 'lucky_confidence',
              evidenceKey: 'lucky_evidence',
              evidence: luckyEvidence({
                present: true,
                position: 'behind_pokemon',
                appearance: 'large_gold_shimmering_background'
              })
            },
            {
              field: 'effective_favorite_state',
              expected: 'yes',
              stateKey: 'favorite_state',
              confidenceKey: 'favorite_confidence',
              evidenceKey: 'favorite_evidence',
              evidence: appearanceEvidence({
                present: true,
                position: 'upper_right',
                appearance: 'filled_yellow_five_point_star'
              })
            },
            {
              field: 'effective_rocket_state',
              expected: 'shadow',
              stateKey: 'rocket_state',
              confidenceKey: 'rocket_confidence',
              evidenceKey: 'rocket_evidence',
              evidence: rocketEvidence({
                present: true,
                position: 'around_pokemon',
                color: 'purple',
                shape: 'purple_smoke'
              })
            },
            {
              field: 'effective_background_type',
              expected: 'special',
              stateKey: 'background_type',
              confidenceKey: 'background_confidence',
              evidenceKey: 'background_evidence',
              evidence: backgroundEvidence({
                present: true,
                position: 'near_pokemon_or_card_background',
                badge_type: 'special_background_badge',
                appearance: 'event_special_background'
              })
            }
          ];

          positiveCases.forEach(testCase => {
            const atThreshold = validateHundoCardStates(normalizedCard({
              [testCase.stateKey]: testCase.expected === 'yes' ? 'yes' : testCase.expected,
              [testCase.confidenceKey]: 0.85,
              [testCase.evidenceKey]: testCase.evidence
            }));
            equal(atThreshold[testCase.field], testCase.expected, `${testCase.field} accepts 0.85`);

            const belowThreshold = validateHundoCardStates(normalizedCard({
              [testCase.stateKey]: testCase.expected === 'yes' ? 'yes' : testCase.expected,
              [testCase.confidenceKey]: 0.849,
              [testCase.evidenceKey]: testCase.evidence
            }));
            equal(belowThreshold[testCase.field], 'uncertain', `${testCase.field} rejects confidence below 0.85`);
          });
        });

        test('validates dark teal CP-area sparkles as shiny', () => {
          const validated = validateHundoCardStates(normalizedCard({
            shiny_state: 'yes',
            shiny_confidence: 0.98,
            shiny_evidence: {
              present: true,
              region_visibility: 'clear',
              position: 'cp_area',
              color: 'dark_blue_teal',
              shape: 'multiple_four_point_sparkles'
            }
          }));
          equal(validated.effective_shiny_state, 'yes');
          equal(buildHundoDisplayName(validated, normalizeName), '色違超夢');
        });

        test('purified Groudon never becomes shiny from cyan radial evidence', () => {
          const validated = validateHundoCardStates(normalizedCard({
            official_name: '固拉多',
            shiny_state: 'yes',
            shiny_confidence: 0.98,
            shiny_evidence: cyanPurificationEvidence(),
            rocket_state: 'purified',
            rocket_confidence: 0.98,
            rocket_evidence: cyanPurificationEvidence()
          }));
          equal(validated.effective_shiny_state, 'uncertain');
          equal(validated.effective_rocket_state, 'purified');
          equal(buildHundoDisplayName(validated, normalizeName), '固拉多');
        });

        test('validates combined shiny and shadow evidence in fixed display order', () => {
          const validated = validateHundoCardStates(normalizedCard({
            official_name: '超夢',
            shiny_state: 'yes',
            shiny_confidence: 0.98,
            shiny_evidence: sparkleEvidence({
              present: true,
              position: 'cp_area',
              color: 'blue_black',
              shape: 'multiple_four_point_sparkles'
            }),
            rocket_state: 'shadow',
            rocket_confidence: 0.98,
            rocket_evidence: rocketEvidence({
              present: true,
              position: 'around_pokemon',
              color: 'purple',
              shape: 'purple_flame'
            })
          }));
          equal(validated.effective_shiny_state, 'yes');
          equal(validated.effective_rocket_state, 'shadow');
          equal(buildHundoDisplayName(validated, normalizeName), '色違暗影超夢');
        });

        test('rejects raw and positive-evidence contradictions without inferring alternatives', () => {
          const contradictions = [
            validateHundoCardStates(normalizedCard({
              shiny_state: 'no',
              shiny_evidence: sparkleEvidence({
                present: true,
                position: 'cp_area',
                color: 'dark_blue',
                shape: 'multiple_four_point_sparkles'
              })
            })).effective_shiny_state,
            validateHundoCardStates(normalizedCard({
              lucky_state: 'no',
              lucky_evidence: luckyEvidence({
                present: true,
                position: 'behind_pokemon',
                appearance: 'large_gold_shimmering_background'
              })
            })).effective_lucky_state,
            validateHundoCardStates(normalizedCard({
              favorite_state: 'no',
              favorite_evidence: appearanceEvidence({
                present: true,
                position: 'upper_right',
                appearance: 'filled_yellow_five_point_star'
              })
            })).effective_favorite_state,
            validateHundoCardStates(normalizedCard({
              rocket_state: 'shadow',
              rocket_evidence: cyanPurificationEvidence()
            })).effective_rocket_state,
            validateHundoCardStates(normalizedCard({
              background_type: 'commemorative',
              background_evidence: backgroundEvidence({
                present: true,
                position: 'near_pokemon_or_card_background',
                badge_type: 'special_background_badge',
                appearance: 'event_special_background'
              })
            })).effective_background_type
          ];
          deepEqual(contradictions, ['uncertain', 'uncertain', 'uncertain', 'uncertain', 'uncertain']);
        });

        test('requires exact clear all-none evidence for every negative state', () => {
          const negativeCases = [
            {
              field: 'effective_shiny_state',
              expected: 'no',
              stateKey: 'shiny_state',
              confidenceKey: 'shiny_confidence',
              evidenceKey: 'shiny_evidence',
              evidence: sparkleEvidence(),
              nonNegativeEvidence: sparkleEvidence({ color: 'other' })
            },
            {
              field: 'effective_lucky_state',
              expected: 'no',
              stateKey: 'lucky_state',
              confidenceKey: 'lucky_confidence',
              evidenceKey: 'lucky_evidence',
              evidence: luckyEvidence(),
              nonNegativeEvidence: luckyEvidence({ appearance: 'other' })
            },
            {
              field: 'effective_favorite_state',
              expected: 'no',
              stateKey: 'favorite_state',
              confidenceKey: 'favorite_confidence',
              evidenceKey: 'favorite_evidence',
              evidence: appearanceEvidence(),
              nonNegativeEvidence: appearanceEvidence({ position: 'other' })
            },
            {
              field: 'effective_rocket_state',
              expected: 'normal',
              stateKey: 'rocket_state',
              confidenceKey: 'rocket_confidence',
              evidenceKey: 'rocket_evidence',
              evidence: rocketEvidence(),
              nonNegativeEvidence: rocketEvidence({ shape: 'other' })
            },
            {

              official_name: '哲爾尼亞斯',
              background_type: 'uncertain',
              background_confidence: 0.99
            }),
            v2Card({ order: 3, row: 2, cp: '3', visible_label: '三', official_name: '雷吉奇卡斯' })
          ]));

          await autoScan();

          equal(document.getElementById('aiAutoStatus').textContent, '百神掃描完成：總數3，偵測3張卡片，辨識3張；1張背卡狀態需人工確認');
          equal(window.lastSmartHundoDiagnostics.manual_review_reasons.includes('background_uncertain'), true);
        });

        await asyncTest('shows deduplicated reviewed-card total alongside multiple per-reason buckets', async () => {
          resetScanScenario();
          setScanFiles(['MULTI_REVIEW']);
          countResultByImage.set('MULTI_REVIEW', validCount('(1)', '1'));
          cardResultByImage.set('MULTI_REVIEW', completeCardResult([
            v2Card({
              cp: '1001',
              visible_label: '雙重確認',
              official_name: '超夢',
              shiny_state: 'uncertain',
              shiny_confidence: 0.99,
              background_type: 'uncertain',
              background_confidence: 0.99
            })
          ]));

          await autoScan();

          equal(
            document.getElementById('aiAutoStatus').textContent,
            '百神掃描完成：總數1，偵測1張卡片，辨識1張；共1張卡片需人工確認；1張色違狀態需人工確認；1張背卡狀態需人工確認'
          );
          deepEqual(window.lastSmartHundoDiagnostics.manual_review_reasons, [
            'shiny_uncertain',
            'background_uncertain'
          ]);
        });

        await asyncTest('retains repeated screenshot review occurrences in diagnostics and visible status', async () => {
          resetScanScenario();
          setScanFiles(['REPEATED_INCOMPLETE_A', 'REPEATED_INCOMPLETE_B']);
          ['REPEATED_INCOMPLETE_A', 'REPEATED_INCOMPLETE_B'].forEach((identity, index) => {
            countResultByImage.set(identity, validCount('(2)', '2'));
            const result = completeCardResult([
              v2Card({
                cp: String(2000 + index),
                visible_label: identity,
                official_name: index === 0 ? '鳳王' : '超夢'
              })
            ], { scan_complete: false });
            cardResultByImage.set(identity, [result, result]);
          });

          await autoScan();

          equal(
            document.getElementById('aiAutoStatus').textContent,
            '百神掃描完成：總數2，辨識2張卡片；2次卡片列舉不完整，需人工確認'
          );
          deepEqual(
            window.lastSmartHundoDiagnostics.manual_review_reasons.filter(
              reason => reason === 'incomplete_card_enumeration'
            ),
            ['incomplete_card_enumeration', 'incomplete_card_enumeration']
          );
        });

        await asyncTest('uses one structural retry replacement and reports incomplete enumeration', async () => {
          resetScanScenario();
          setScanFiles(['INCOMPLETE']);
          countResultByImage.set('INCOMPLETE', validCount('(3)', '3'));
          cardResultByImage.set('INCOMPLETE', [
            completeCardResult([
              v2Card({ cp: '1', visible_label: 'first', official_name: '第一次卡片' })
            ], { detected_card_count: 2, scan_complete: false }),
            completeCardResult([
              v2Card({ cp: '2', visible_label: 'second', official_name: '第二次卡片' })
            ], { detected_card_count: 2, bottom_edge_checked: false })
          ]);

          await autoScan();

          const cardRequests = routedRequests.filter(request => request.schemaName === 'pokemon_go_hundo_smart_extractor_v2');
          equal(cardRequests.length, 2, 'structural retry is attempted at most once');
          equal(document.getElementById('g_hundos').value, '第二次卡片', 'attempt two fully replaces attempt one');
          equal(document.getElementById('g_hundos').value.includes('第一次卡片'), false);
          equal(document.getElementById('aiAutoStatus').textContent.includes(HUNDO_REVIEW_REASON_MESSAGES.incomplete_card_enumeration), true);
          equal(window.lastSmartHundoDiagnostics.screenshots[0].structural_retry_used, true);
          deepEqual(window.lastSmartHundoDiagnostics.screenshots[0].structural_retry_reason, [
            'detected_card_count_mismatch',
            'scan_incomplete'
          ]);
          equal(window.lastSmartHundoDiagnostics.screenshots[0].cards[0].official_name, '第二次卡片');
        });

        await asyncTest('keeps a one-card overlap and reports overlap uncertainty', async () => {
          resetScanScenario();
          setScanFiles(['OVERLAP_A', 'OVERLAP_B']);
          const overlapCard = v2Card({ cp: '4444', visible_label: '同卡', official_name: '超夢' });
          countResultByImage.set('OVERLAP_A', validCount('(2)', '2'));
          countResultByImage.set('OVERLAP_B', validCount('(2)', '2'));
          cardResultByImage.set('OVERLAP_A', completeCardResult([overlapCard]));
          cardResultByImage.set('OVERLAP_B', completeCardResult([{ ...overlapCard }]));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '超夢*2');
          equal(document.getElementById('aiAutoStatus').textContent.includes(HUNDO_REVIEW_REASON_MESSAGES.screenshot_overlap_uncertain), true);
          equal(window.lastSmartHundoDiagnostics.overlap_decisions[0].ambiguous, true);
        });

        await asyncTest('keeps count and list replacements independent across request failures and redacts errors', async () => {
          resetScanScenario();
          setScanFiles(['COUNT_FAIL']);
          failedOperations.add('count:COUNT_FAIL');
          cardResultByImage.set('COUNT_FAIL', completeCardResult([
            v2Card({ cp: '10', visible_label: '成功清單', official_name: '鳳王' })
          ]));
          document.getElementById('st_hundo_leg').value = '77';
          document.getElementById('st_hundo_leg').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('st_hundo_leg').value, '77', 'failed count never overwrites a manual count');
          equal(document.getElementById('g_hundos').value, '鳳王', 'validated cards replace independently');
          equal(document.getElementById('aiAutoStatus').textContent.includes(HUNDO_REVIEW_REASON_MESSAGES.smart_hundo_request_failed), true);

          resetScanScenario();
          setScanFiles(['CARD_FAIL']);
          failedOperations.add('cards:CARD_FAIL');
          countResultByImage.set('CARD_FAIL', validCount('(3)', '3'));
          document.getElementById('g_hundos').value = '手動保留清單';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));
          failedOperationErrorNames.set('cards:CARD_FAIL', 'SECRET_ERROR_NAME_test-key-Bearer');
          const errorLogStart = loggedValues.length;

          await autoScan();

          equal(document.getElementById('st_hundo_leg').value, '3', 'validated count replaces independently');
          equal(document.getElementById('g_hundos').value, '手動保留清單', 'failed card scan never promotes an old or partial AI list');
          equal(document.getElementById('aiAutoStatus').textContent.includes(HUNDO_REVIEW_REASON_MESSAGES.smart_hundo_request_failed), true);
          equal(window.lastSmartHundoDiagnostics.manual_review_reasons.includes('smart_hundo_request_failed'), true);
          equal(window.lastSmartHundoDiagnostics, window.lastSmartHundoScanResult);
          const serializedFailureLogs = JSON.stringify(loggedValues.slice(errorLogStart));
          equal(serializedFailureLogs.includes('SECRET_ERROR_NAME'), false, 'secret-shaped error names never reach logs');
          const cardFailureSummary = loggedValues
            .slice(errorLogStart)
            .flat(2)
            .find(value => value && typeof value === 'object' && value.stage === 'hundo_cards');
          equal(cardFailureSummary.name, 'Error', 'unknown error names fall back to Error');
          const serializedAudit = JSON.stringify(window.lastSmartHundoDiagnostics);
          ['test-key', 'Authorization', 'ORIGINAL_', 'RESIZED_', 'data:image/', 'classificationDataUrl', 'file', 'CARD_FAIL_SECRET', 'COUNT_FAIL_SECRET'].forEach(secret => {
            equal(serializedAudit.includes(secret), false, `audit excludes ${secret}`);
          });
        });

        await asyncTest('preserves a manual hundo list when validated nonzero count contradicts a complete empty extraction', async () => {
          resetScanScenario();
          setScanFiles(['VALID_EMPTY']);
          countResultByImage.set('VALID_EMPTY', validCount('(3)', '3'));
          cardResultByImage.set('VALID_EMPTY', completeCardResult([]));
          document.getElementById('g_hundos').value = '非零總數矛盾時保留';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '非零總數矛盾時保留');
          equal(
            window.lastSmartHundoDiagnostics.manual_review_reasons.includes('incomplete_card_enumeration'),
            true,
            'contradictory empty extraction is not reported as a validated empty list'
          );
          equal(
            document.getElementById('aiAutoStatus').textContent.includes(
              HUNDO_REVIEW_REASON_MESSAGES.incomplete_card_enumeration
            ),
            true,
            'visible status does not imply full success'
          );
        });

        await asyncTest('does not clear a manual hundo list from a conflicted count resolved to zero', async () => {
          resetScanScenario();
          setScanFiles(['COUNT_3_A', 'COUNT_3_B', 'COUNT_9']);
          countResultByImage.set('COUNT_3_A', { ...validCount('(0)', '0'), confidence: 0.91 });
          countResultByImage.set('COUNT_3_B', { ...validCount('(0)', '0'), confidence: 0.89 });
          countResultByImage.set('COUNT_9', { ...validCount('(3)', '3'), confidence: 0.99 });
          ['COUNT_3_A', 'COUNT_3_B', 'COUNT_9'].forEach(identity => {
            cardResultByImage.set(identity, completeCardResult([]));
          });
          document.getElementById('g_hundos').value = '衝突零值須保留';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '衝突零值須保留');
          equal(window.lastSmartHundoDiagnostics.count_conflict, true);
          equal(
            window.lastSmartHundoDiagnostics.manual_review_reasons.includes('incomplete_card_enumeration'),
            true
          );
        });

        await asyncTest('allows a complete confident empty card result when the count operation fails independently', async () => {
          resetScanScenario();
          setScanFiles(['COUNT_FAIL']);
          failedOperations.add('count:COUNT_FAIL');
          cardResultByImage.set('COUNT_FAIL', completeCardResult([]));
          document.getElementById('g_hundos').value = '計數失敗仍由獨立空清單清除';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '');
          equal(
            window.lastSmartHundoDiagnostics.manual_review_reasons.includes('smart_hundo_request_failed'),
            true
          );
        });

        await asyncTest('clears only a fully validated empty smart list and preserves all unresolved empty outcomes', async () => {
          resetScanScenario();
          setScanFiles(['VALID_EMPTY']);
          countResultByImage.set('VALID_EMPTY', validCount('(0)', '0'));
          cardResultByImage.set('VALID_EMPTY', completeCardResult([]));
          document.getElementById('g_hundos').value = '應由有效空結果清除';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '', 'complete zero-card result is an AI-owned empty replacement');

          resetScanScenario();
          setScanFiles(['INCOMPLETE_EMPTY']);
          countResultByImage.set('INCOMPLETE_EMPTY', validCount('(0)', '0'));
          const incompleteEmpty = completeCardResult([], { scan_complete: false });
          cardResultByImage.set('INCOMPLETE_EMPTY', [incompleteEmpty, incompleteEmpty]);
          document.getElementById('g_hundos').value = '不完整空結果須保留';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '不完整空結果須保留');

          resetScanScenario();
          setScanFiles(['UNRECOGNIZED_ONLY']);
          countResultByImage.set('UNRECOGNIZED_ONLY', validCount('(1)', '1'));
          cardResultByImage.set('UNRECOGNIZED_ONLY', completeCardResult([
            v2Card({
              cp: '1111',
              visible_label: '無法辨識',
              official_name: '',
              recognition_status: 'uncertain',
              species_confidence: 0.1
            })
          ]));
          document.getElementById('g_hundos').value = '未辨識非空須保留';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '未辨識非空須保留');

          resetScanScenario();
          setScanFiles(['CARD_FAIL']);
          failedOperations.add('cards:CARD_FAIL');
          document.getElementById('g_hundos').value = '請求失敗須保留';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));

          await autoScan();

          equal(document.getElementById('g_hundos').value, '請求失敗須保留');
        });

        await asyncTest('prevents every delayed mixed-batch status and diagnostic write from replacing the current smart session', async () => {
          resetScanScenario();
          setScanFiles(['PROFILE_DELAY', 'STALE_SMART']);
          delayedOrdinaryIdentity = 'PROFILE_DELAY';
          countResultByImage.set('STALE_SMART', validCount('(8)', '8'));
          cardResultByImage.set('STALE_SMART', completeCardResult([
            v2Card({ cp: '8000', visible_label: '舊批次', official_name: '夢幻' })
          ]));
          const staleScan = autoScan();
          await new Promise(resolve => {
            const waitForDelayedRequest = () => {
              if (releaseDelayedOrdinary) resolve();
              else nativeSetTimeout(waitForDelayedRequest, 0);
            };
            waitForDelayedRequest();
          });

          setScanFiles(['CURRENT_SMART']);
          countResultByImage.set('CURRENT_SMART', validCount('(3)', '3'));
          cardResultByImage.set('CURRENT_SMART', completeCardResult([
            v2Card({ cp: '3000', visible_label: '目前批次', official_name: '鳳王' })
          ]));
          await autoScan();
          const currentDiagnostics = window.lastSmartHundoDiagnostics;
          equal(document.getElementById('aiAutoStatus').textContent, '百神掃描完成：總數3，辨識1張卡片');
          equal(document.getElementById('g_hundos').value, '鳳王');
          equal(document.getElementById('st_hundo_leg').value, '3');

          releaseDelayedOrdinary();
          await staleScan;

          equal(document.getElementById('aiAutoStatus').textContent, '百神掃描完成：總數3，辨識1張卡片');
          equal(document.getElementById('g_hundos').value, '鳳王');
          equal(document.getElementById('st_hundo_leg').value, '3');
          equal(window.lastSmartHundoDiagnostics, currentDiagnostics);
          equal(window.lastSmartHundoScanResult, currentDiagnostics);
        });

        test('production listeners preserve inline behavior and clear AI ownership on manual input', () => {
          document.getElementById('g_hundos').value = '';
          document.getElementById('st_hundo_leg').value = '';
          const session = beginSmartHundoScanSession();
          markSmartHundoAiValue('g_hundos', 'AI 清單', session);
          markSmartHundoAiValue('st_hundo_leg', '6', session);
          document.getElementById('g_hundos').value = '手動清單';
          document.getElementById('g_hundos').dispatchEvent(new Event('input'));
          document.getElementById('st_hundo_leg').value = '8';
          document.getElementById('st_hundo_leg').dispatchEvent(new Event('input'));
          beginSmartHundoScanSession();
          equal(document.getElementById('g_hundos').value, '手動清單');
          equal(document.getElementById('st_hundo_leg').value, '8');
          equal(inlineHundoInputCalls > 0, true, 'addEventListener does not replace the existing inline handler');
        });

        await asyncTest('does not begin a smart session or overwrite diagnostics for an ordinary-only batch', async () => {
          resetScanScenario();
          setScanFiles(['PROFILE']);
          const sentinel = { ordinary_only: true };
          window.lastSmartHundoDiagnostics = sentinel;
          window.lastSmartHundoScanResult = sentinel;
          await autoScan();
          equal(window.lastSmartHundoDiagnostics, sentinel);
          equal(window.lastSmartHundoScanResult, sentinel);
          equal(alertMessages.join('\n').includes('百神清單'), false, 'ordinary coverage contract does not add smart-list alerts');
        });

        const serializedLogs = JSON.stringify(loggedValues);
        equal(serializedLogs.includes('test-key'), false, 'logs omit the API key');
        equal(serializedLogs.includes('data:image/'), false, 'logs omit image data URLs');
        equal(serializedLogs.includes('CARD_FAIL_SECRET'), false, 'logs omit thrown response details');
        equal(serializedLogs.includes('COUNT_FAIL_SECRET'), false, 'logs omit thrown response details');
        const safeErrorSummaries = loggedValues
          .flat(2)
          .filter(value => value && typeof value === 'object' && value.reasonCode === 'smart_hundo_request_failed');
        equal(safeErrorSummaries.length >= 2, true, 'each failed logical operation emits a safe summary');
        safeErrorSummaries.forEach(summary => {
          deepEqual(Object.keys(summary), ['stage', 'name', 'httpStatus', 'reasonCode']);
          equal(['hundo_count', 'hundo_cards'].includes(summary.stage), true);
          equal(['Error'].includes(summary.name), true);
          equal([502, 503].includes(summary.httpStatus), true);
        });

        executionStatus = 'pass';
      } catch (error) {
        results.push(`FAIL ${error && error.message ? error.message : String(error)}`);
        executionStatus = 'fail';
      }

      await new Promise(resolve => nativeSetTimeout(resolve, 0));
      renderTestSummary();
    })();
  </script>
