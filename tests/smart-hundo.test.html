<!doctype html>
<html lang="en">

<body data-test-status="running">
  <pre id="results"></pre>
  <script>
    (async () => {
      'use strict';

      const results = [];
      const loggedValues = [];
      const unexpectedDiagnostics = [];
      const nativeSetTimeout = globalThis.setTimeout.bind(globalThis);
      let executionStatus = 'running';
      const serializeHarnessValue = (value, seen = new WeakSet()) => {
        if (value instanceof Error) {
          return {
            name: String(value.name || 'Error'),
            message: String(value.message || ''),
            stack: String(value.stack || '')
          };
        }
        if (value === null || ['string', 'number', 'boolean'].includes(typeof value)) return value;
        if (['undefined', 'bigint', 'symbol', 'function'].includes(typeof value)) return String(value);
        if (seen.has(value)) return '[Circular]';
        seen.add(value);
        if (Array.isArray(value)) return value.map(item => serializeHarnessValue(item, seen));
        try {
          return Object.fromEntries(
            Object.entries(value).map(([key, item]) => [key, serializeHarnessValue(item, seen)])
          );
        } catch (error) {
          return {
            name: 'UnserializableValue',
            message: String(error && error.message ? error.message : error),
            stack: ''
          };
        }
      };
      const createHarnessErrorRecorder = (target, onRecord = () => {}) => {
        const record = (channel, args) => {
          const diagnostic = {
            channel,
            arguments: args.map(argument => serializeHarnessValue(argument))
          };
          target.push(diagnostic);
          onRecord();
          return diagnostic;
        };
        return {
          consoleError: (...args) => record('console.error', args),
          windowError: (event = {}) => record('window.error', [
            event.error instanceof Error
              ? event.error
              : { name: 'Error', message: String(event.message || 'Unknown window error'), stack: '' }
          ]),
          unhandledRejection: (event = {}) => record('unhandledrejection', [
            event.reason === undefined ? 'Unknown unhandled rejection' : event.reason
          ])
        };
      };
      const deriveHarnessStatus = (status, failedCount, diagnostics) => (
        status === 'pass' && failedCount === 0 && diagnostics.length === 0 ? 'pass' : 'fail'
      );
      const renderTestSummary = () => {
        const passedCount = results.filter(result => result.startsWith('PASS ')).length;
        const assertionFailures = results.filter(result => result.startsWith('FAIL '));
        const diagnosticFailures = unexpectedDiagnostics.map(diagnostic => (
          `FAIL ${diagnostic.channel}: ${JSON.stringify(diagnostic.arguments)}`
        ));
        const failedCount = assertionFailures.length + diagnosticFailures.length;
        document.body.dataset.testPassed = String(passedCount);
        document.body.dataset.testFailed = String(failedCount);
        document.body.dataset.testStatus = deriveHarnessStatus(executionStatus, failedCount, unexpectedDiagnostics);
        document.getElementById('results').textContent = [...results, ...diagnosticFailures].join('\n');
      };
      const harnessErrorRecorder = createHarnessErrorRecorder(unexpectedDiagnostics, renderTestSummary);
      window.addEventListener('error', harnessErrorRecorder.windowError);
      window.addEventListener('unhandledrejection', harnessErrorRecorder.unhandledRejection);
      console.log = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.warn = (...args) => { loggedValues.push(args.map(argument => serializeHarnessValue(argument))); };
      console.error = (...args) => {
        loggedValues.push(args.map(argument => serializeHarnessValue(argument)));
        harnessErrorRecorder.consoleError(...args);
      };
      const fail = (message) => { throw new Error(message); };
      const equal = (actual, expected, message = 'values differ') => {
        if (actual !== expected) fail(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      };
      const deepEqual = (actual, expected, message = 'values differ') => {
        const actualJson = JSON.stringify(actual);
        const expectedJson = JSON.stringify(expected);
        if (actualJson !== expectedJson) fail(`${message}: expected ${expectedJson}, got ${actualJson}`);
      };
      const test = (name, callback) => {
        callback();
        results.push(`PASS ${name}`);
      };
      const asyncTest = async (name, callback) => {
        await callback();
        results.push(`PASS ${name}`);
      };
      const trainerContractFailures = [];
      const trainerContractTest = (name, callback) => {
        try {
          callback();
          results.push(`PASS trainer-team integration: ${name}`);
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          trainerContractFailures.push({ name, message });
          results.push(`FAIL trainer-team integration: ${name}: ${message}`);
        }
      };
      const trainerContractAsyncTest = async (name, callback) => {
        try {
          await callback();
          results.push(`PASS trainer-team integration: ${name}`);
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          trainerContractFailures.push({ name, message });
          results.push(`FAIL trainer-team integration: ${name}: ${message}`);
        }
      };
      const sparkleEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        color: 'none',
        shape: 'none',
        ...overrides
      });
      const appearanceEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        appearance: 'none',
        ...overrides
      });
      const luckyEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        appearance: 'none',
        ...overrides
      });
      const rocketEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        color: 'none',
        shape: 'none',
        ...overrides
      });
      const backgroundEvidence = (overrides = {}) => ({
        present: false,
        region_visibility: 'clear',
        position: 'none',
        badge_type: 'none',
        appearance: 'none',
        ...overrides
      });
      const formEvidence = (overrides = {}) => ({

        recognition_basis: 'direct_visual_match',
        visual_signature: 'moltres_galarian',
        body_plan: 'not_applicable',
        limb_layout: 'not_applicable',
        fusion_host: 'not_applicable',
        decisive_feature: 'not_applicable',
        key_features_visible: true,
        label_relationship: 'base_species_only',
        ...overrides
      });
      const expectedSpecializedFormEvidence = {

          body_plan: 'dialga_standard_stocky_quadruped',
          limb_layout: 'four_standard_legs',
          fusion_host: 'not_applicable',
          decisive_feature: 'standard_dialga_stocky_neck_chest'
        },
        dialga_origin: {
          body_plan: 'dialga_origin_elongated_equine_quadruped',
          limb_layout: 'four_long_legs',
          fusion_host: 'not_applicable',
          decisive_feature: 'origin_dialga_elongated_neck_chest'
        },
        palkia_standard: {
          body_plan: 'palkia_standard_upright_bipedal_dragon',
          limb_layout: 'two_arms_two_legs',
          fusion_host: 'not_applicable',
          decisive_feature: 'standard_palkia_visible_arms'
        },
        palkia_origin: {

      const cyanPurificationEvidence = () => ({

      });
      const card = (overrides = {}) => ({
        order: 1,
        row: 1,

        official_name: '超夢',
        recognition_status: 'recognized',
        species_confidence: 0.9,
        cp: 1234,
        shiny_state: 'no',
        shiny_confidence: 0.9,

      const formCard = (overrides = {}) => card({

      const validatedCard = (overrides = {}) => ({

        card_id: '0:1:1:1',
        effective_shiny_state: 'no',
        effective_lucky_state: 'no',
        effective_favorite_state: 'no',
        effective_rocket_state: 'normal',
        effective_background_type: 'none',
        canonical_official_name: normalizeName(overrides.official_name ?? '超夢'),
        manual_review_reasons: [],
        ...overrides
      });
      const normalizeName = (value) => String(value ?? '').trim().replace(/^官方:/, '');
      const assertRejects = async (promise, expectedMessage, forbiddenValue) => {
        try {
          await promise;
          fail('expected promise to reject');
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          if (!message.includes(expectedMessage)) fail(`expected error containing ${JSON.stringify(expectedMessage)}, got ${JSON.stringify(message)}`);
          if (forbiddenValue && message.includes(forbiddenValue)) fail('error message exposed the data URL');
        }
      };

      try {
        const helpers = globalThis.SmartHundoHelpers;
        if (!helpers) fail('SmartHundoHelpers is missing');
        const {
          normalizeSearchQuery,
          isSmartHundoClassification,
          partitionImageJobs,
          adaptLegacyRocketState,
          HUNDO_FORM_CANONICAL_NAMES,
          HUNDO_FORMS_BY_BASE_SPECIES,
          REQUIRED_SPECIALIZED_FORM_EVIDENCE,
          normalizeHundoBaseSpecies,
          normalizeHundoFormId,
          normalizeHundoFormEvidence,
          adaptLegacyHundoForm,
          normalizeSmartHundoCard,
          normalizeSmartHundoResult: normalizeSmartHundoResultV2,
          validateSmartHundoStructure,
          buildHundoDisplayName,
          smartHundoCardsToPokemonList: effectiveSmartHundoCardsToPokemonList,
          summarizeHundoManualReview,
          HUNDO_REVIEW_REASON_MESSAGES,
          HUNDO_COUNT_CONFIDENCE_THRESHOLD,
          SPECIES_CONFIDENCE_THRESHOLD,
          FORM_CONFIDENCE_THRESHOLD,
          FORM_PARTIAL_VISIBILITY_THRESHOLD,
          STATE_YES_CONFIDENCE_THRESHOLD,
          STATE_NEGATIVE_CONFIDENCE_THRESHOLD,
          ENUMERATION_CONFIDENCE_THRESHOLD,
          isValidShinyEvidence,
          isValidLuckyEvidence,
          isValidFavoriteEvidence,
          deriveRocketStateFromEvidence,
          deriveBackgroundTypeFromEvidence,
          validateHundoCardStates,
          validateSpecializedFormEvidence,
          validateHundoPokemonForm,
          buildHundoCanonicalOfficialName,
          normalizeHundoCountResult,
          validateHundoCountEvidence,
          mergeHundoCountResults,
          normalizeVisibleLabel,
          detectScreenshotOverlap,
          mergeSmartHundoScreenshots,
          shapeSmartHundoDiagnostics
        } = helpers;
        const normalizedCard = (overrides = {}) => normalizeSmartHundoCard(
          card(overrides),
          normalizeName,
          { screenshotIndex: 0 }
        );
        const validatedFormCard = (overrides = {}) => validateHundoPokemonForm(
          normalizeSmartHundoCard(formCard(overrides), normalizeName, { screenshotIndex: 0 }),
          normalizeName
        );
        const validatedSpecializedFormCard = (formId, evidenceOverrides = {}, cardOverrides = {}) => {
          const baseSpecies = Object.entries(HUNDO_FORMS_BY_BASE_SPECIES)
            .find(([, formIds]) => formIds.includes(formId))[0];
          return validateHundoPokemonForm(
            normalizeSmartHundoCard(formCard({
              official_name: baseSpecies,
              visible_label: baseSpecies,
              base_species: baseSpecies,
              form_id: formId,
              form_evidence: formEvidenceForForm(formId, evidenceOverrides),
              ...cardOverrides
            }), normalizeName, { screenshotIndex: 0 }),
            normalizeName
          );
        };
        const displayFormCard = (formId, overrides = {}) => {
          const baseByForm = Object.entries(HUNDO_FORMS_BY_BASE_SPECIES)
            .find(([, ids]) => ids.includes(formId))[0];
          return {
            ...validatedCard(),
            base_species: baseByForm,
            form_id: formId,
            form_confidence: 0.99,
            form_evidence: formEvidenceForForm(formId, {
              label_relationship: 'exact_form'
            }),
            effective_form_id: formId,
            canonical_official_name: HUNDO_FORM_CANONICAL_NAMES[formId],
            official_name: baseByForm,
            ...overrides
          };
        };
        const modelCard = (overrides = {}) => {
          const officialName = String(overrides.official_name ?? '超夢');
          const normalized = card({
            base_species: officialName,
            form_id: 'not_applicable',
            form_confidence: 1,
            form_evidence: {
              region_visibility: 'clear',
              recognition_basis: 'direct_visual_match',
              visual_signature: 'not_applicable',
              body_plan: 'not_applicable',
              limb_layout: 'not_applicable',
              fusion_host: 'not_applicable',
              decisive_feature: 'not_applicable',
              key_features_visible: true,
              label_relationship: 'not_applicable'
            },
            ...overrides
          });
          normalized.cp = String(normalized.cp ?? '');
          delete normalized.purified_state;
          delete normalized.purified_confidence;
          delete normalized.shadow_state;
          delete normalized.shadow_confidence;
          return normalized;
        };
        const makeModelCards = (count, overrides = {}) => Array.from({ length: count }, (_, index) => modelCard({
          order: index + 1,
          row: Math.floor(index / 3) + 1,
          column: (index % 3) + 1,
          ...overrides
        }));
        test('keeps API-shaped model fixtures on the current four-field form contract', () => {
          const fixture = modelCard();
          ['base_species', 'form_id', 'form_confidence', 'form_evidence'].forEach(field => {
            equal(Object.hasOwn(fixture, field), true, field);
          });
          equal(typeof fixture.cp, 'string', 'default cp is schema-valid');
          equal(typeof modelCard({ cp: 42 }).cp, 'string', 'numeric override cp is schema-valid');
          equal(Object.hasOwn(fixture, 'purified_state'), false);
          equal(Object.hasOwn(fixture, 'shadow_state'), false);
        });

        test('maps all 23 approved form IDs to exact canonical names', () => {
          const expected = {
            articuno_standard: '急凍鳥',
            articuno_galarian: '伽勒爾急凍鳥',
            zapdos_standard: '閃電鳥',
            zapdos_galarian: '伽勒爾閃電鳥',
            moltres_standard: '火焰鳥',
            moltres_galarian: '伽勒爾火焰鳥',
            zacian_standard: '蒼響',
            zacian_crowned: '蒼響劍盾型態',
            zamazenta_standard: '藏瑪然特',
            zamazenta_crowned: '藏瑪然特劍盾型態',
            dialga_standard: '帝牙盧卡',
            dialga_origin: '起源帝牙盧卡',
            palkia_standard: '帕路奇亞',
            palkia_origin: '起源帕路奇亞',
            zygarde_10: '基格爾德（10%形態）',
            zygarde_50: '基格爾德（50%形態）',
            zygarde_complete: '基格爾德（完全體形態）',
            necrozma_base: '奈克洛茲瑪',
            necrozma_dusk_mane: '奈克洛茲瑪（黃昏之鬃）',
            necrozma_dawn_wings: '奈克洛茲瑪（拂曉之翼）',
            kyurem_base: '酋雷姆',
            kyurem_white: '焰白酋雷姆',
            kyurem_black: '闇黑酋雷姆'
          };
          deepEqual(HUNDO_FORM_CANONICAL_NAMES, expected);
          equal(Object.isFrozen(HUNDO_FORM_CANONICAL_NAMES), true);
          equal(Object.keys(HUNDO_FORM_CANONICAL_NAMES).length, 23);
        });

        test('allows each supported form only for its approved base species', () => {
          const expectedCompatibility = {
            急凍鳥: ['articuno_standard', 'articuno_galarian'],
            閃電鳥: ['zapdos_standard', 'zapdos_galarian'],
            火焰鳥: ['moltres_standard', 'moltres_galarian'],
            蒼響: ['zacian_standard', 'zacian_crowned'],
            藏瑪然特: ['zamazenta_standard', 'zamazenta_crowned'],
            帝牙盧卡: ['dialga_standard', 'dialga_origin'],
            帕路奇亞: ['palkia_standard', 'palkia_origin'],
            基格爾德: ['zygarde_10', 'zygarde_50', 'zygarde_complete'],
            奈克洛茲瑪: ['necrozma_base', 'necrozma_dusk_mane', 'necrozma_dawn_wings'],
            酋雷姆: ['kyurem_base', 'kyurem_white', 'kyurem_black']
          };
          deepEqual(HUNDO_FORMS_BY_BASE_SPECIES, expectedCompatibility);
          equal(Object.isFrozen(HUNDO_FORMS_BY_BASE_SPECIES), true);
          equal(Object.keys(HUNDO_FORMS_BY_BASE_SPECIES).length, 10);
          const ownership = new Map();
          Object.entries(HUNDO_FORMS_BY_BASE_SPECIES).forEach(([species, ids]) => {
            equal(Object.isFrozen(ids), true);
            ids.forEach(id => {
              equal(ownership.has(id), false, `${id} has exactly one owner`);
              ownership.set(id, species);
            });
          });
          equal(ownership.size, 23);
          equal(ownership.get('moltres_galarian'), '火焰鳥');
          equal(HUNDO_FORMS_BY_BASE_SPECIES['火焰鳥'].includes('dialga_origin'), false);
          deepEqual(REQUIRED_SPECIALIZED_FORM_EVIDENCE, expectedSpecializedFormEvidence);
          equal(Object.isFrozen(REQUIRED_SPECIALIZED_FORM_EVIDENCE), true);
          Object.values(REQUIRED_SPECIALIZED_FORM_EVIDENCE).forEach(evidence => {
            equal(Object.isFrozen(evidence), true);
          });
          const whitelistSpecies = Object.keys(expectedCompatibility);
          Object.entries(expectedCompatibility).forEach(([literalOwner, formIds]) => {
            formIds.forEach(formId => {
              const validateForSpecies = (baseSpecies) => validateHundoPokemonForm(
                normalizeSmartHundoCard(formCard({
                  official_name: baseSpecies,
                  visible_label: baseSpecies,
                  base_species: baseSpecies,
                  form_id: formId,
                  form_evidence: formEvidenceForForm(formId)
                }), normalizeName, { screenshotIndex: 0 }),
                normalizeName
              );
              equal(validateForSpecies(literalOwner).effective_form_id, formId, `${formId} literal owner`);
              whitelistSpecies.filter(species => species !== literalOwner).forEach(otherSpecies => {
                const rejected = validateForSpecies(otherSpecies);
                equal(rejected.effective_form_id, 'uncertain', `${formId} rejects ${otherSpecies}`);
                equal(rejected.manual_review_reasons.includes('form_species_mismatch'), true, `${formId} rejects ${otherSpecies}`);
              });
            });
          });
        });

        test('normalizes all supported base aliases without generic standard-form fallback', () => {
          const aliases = [
            ['伽勒爾急凍鳥', '急凍鳥'], ['伽勒爾閃電鳥', '閃電鳥'], ['伽勒爾火焰鳥', '火焰鳥'],
            ['蒼響劍王', '蒼響'], ['蒼響（劍之王）', '蒼響'], ['蒼響劍盾型態', '蒼響'],
            ['藏瑪然特盾王', '藏瑪然特'], ['藏瑪然特（盾之王）', '藏瑪然特'], ['藏瑪然特劍盾型態', '藏瑪然特'],
            ['帝牙盧卡（起源形態）', '帝牙盧卡'], ['起源型態帝牙盧卡', '帝牙盧卡'], ['起源帝牙盧卡', '帝牙盧卡'],
            ['帕路奇亞（起源形態）', '帕路奇亞'], ['起源型態帕路奇亞', '帕路奇亞'], ['起源帕路奇亞', '帕路奇亞'],
            ['基格爾德（10%形態）', '基格爾德'], ['基格爾德（50%形態）', '基格爾德'], ['基格爾德（完全體形態）', '基格爾德'],
            ['奈克洛茲瑪（黃昏之鬃）', '奈克洛茲瑪'], ['奈克洛茲瑪（拂曉之翼）', '奈克洛茲瑪'],
            ['焰白酋雷姆', '酋雷姆'], ['炎白酋雷姆', '酋雷姆'], ['闇黑酋雷姆', '酋雷姆']

          aliases.forEach(([alias, species]) => equal(normalizeHundoBaseSpecies(alias, normalizeName), species, alias));

          equal(normalizeHundoBaseSpecies('超夢', normalizeName), '超夢');
          deepEqual(adaptLegacyHundoForm({ official_name: '伽勒爾火焰鳥' }, normalizeName), {
            base_species: '火焰鳥', form_id: 'moltres_galarian'
          });
          deepEqual(adaptLegacyHundoForm({ official_name: '火焰鳥' }, normalizeName), {
            base_species: '火焰鳥', form_id: 'uncertain'
          });
          deepEqual(adaptLegacyHundoForm({ official_name: '超夢' }, normalizeName), {
            base_species: '超夢', form_id: 'not_applicable'
          });
        });

        test('normalizes the raw form contract without trusting it as effective output', () => {
          const normalized = normalizeSmartHundoCard(formCard(), normalizeName, { screenshotIndex: 2 });
          equal(normalized.base_species, '火焰鳥');
          equal(normalized.form_id, 'moltres_galarian');
          equal(normalized.form_confidence, 0.98);
          deepEqual(normalized.form_evidence, formEvidence());
          equal(normalized.effective_form_id, 'uncertain');
          equal(normalized.canonical_official_name, '');
          deepEqual(normalized.raw.form, {
            base_species: '火焰鳥',
            form_id: 'moltres_galarian',
            form_confidence: 0.98,
            form_evidence: formEvidence()
          });
          equal(normalizeHundoFormId('unsupported'), 'unsupported');
          ['', 'standard', 'moltres_galarian ', 'dialga-origin', null].forEach(value => {
            equal(normalizeHundoFormId(value), 'uncertain', `invalid form ${JSON.stringify(value)}`);
          });
          const outsideWhitelist = normalizeSmartHundoCard(formCard({
            base_species: '超夢', form_id: 'not_applicable'

            });

              });

              if (Object.hasOwn(value, field)) assertJsonSchemaValue(value[field], fieldSchema, `${path}.${field}`);
            });
            return;

          if (schema?.type === 'array') {
            if (!Array.isArray(value)) fail(`${path} must be an array`);
            value.forEach((item, index) => assertJsonSchemaValue(item, schema.items, `${path}[${index}]`));
            return;

          if (schema?.type === 'integer') {
            if (!Number.isInteger(value)) fail(`${path} must be an integer`);
          } else if (schema?.type === 'number') {
            if (typeof value !== 'number' || !Number.isFinite(value)) fail(`${path} must be a finite number`);

            const response = await responder({ url, options, payload, schemaName });
            if (!response) throw new Error(`strict OpenAI mock has no response for schema: ${schemaName}`);
            if (typeof response.json === 'function') {

                    try {
